<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182033"/><stop offset="1" stop-color="#0b0f19"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffc15e"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1f2940" stroke-width="1"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="220" rx="20" fill="url(#grid)" opacity=".5"/>
  <rect x="56" y="62" width="6" height="116" rx="3" fill="#3fb950"/>
  <text x="84" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f0f3f8">Lab Check</text>
  <text x="86" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#aab4c8">Grade a lab with checks and get</text><text x="86" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#aab4c8">a score report right in the editor</text>
  <g filter="url(#shadow)"><rect x="700" y="24" width="480" height="172" rx="10" fill="#1e1e1e" stroke="#333"/>
    <circle cx="752" cy="74" r="30" fill="none" stroke="#333" stroke-width="8"/>
    <circle cx="752" cy="74" r="30" fill="none" stroke="#3fb950" stroke-width="8" stroke-dasharray="157 189" transform="rotate(-90 752 74)" stroke-linecap="round"/>
    <text x="752" y="79" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">83%</text>
    <text x="800" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e7e7e7">VLAN lab</text><text x="800" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b8b8b">4 of 5 checks passed, score 5/6</text><text x="730" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3fb950">✔</text><text x="752" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ccc">VLAN 10 exists on S1</text><text x="1150" y="128" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b8b8b">2/2</text><text x="730" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3fb950">✔</text><text x="752" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ccc">R1 is cabled to S1</text><text x="1150" y="148" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b8b8b">1/1</text><text x="730" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3fb950">✔</text><text x="752" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ccc">PC1 has 192.168.10.11/24</text><text x="1150" y="168" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b8b8b">1/1</text><text x="730" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#f85149">✘</text><text x="752" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ccc">PC2 has an address</text><text x="1150" y="188" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b8b8b">0/1</text></g>
</svg>
