    var parts = [];
    var re = /([A-Za-z_$][\w$]*)|\[(\d+)\]|\["([^"]*)"\]|\['([^']*)'\]/g;
    var rest = expression.replace(/\s+/g, "");
    var m;
    var consumed = 0;
    while ((m = re.exec(rest))) {
        var gap = rest.substring(consumed, m.index);
        if (gap !== "" && gap !== ".") {
            return null;
        }
        parts.push(m[1] || m[2] || m[3] || m[4]);
        consumed = m.index + m[0].length;
    }
    if (!parts.length || consumed !== rest.length) {
        return null;
    }
    var current = null;
    for (var s = 0; s < entry.scopes.length && !current; s++) {
        entry.scopes[s].vars.forEach(function (pair) {
            if (!current && pair[0] === parts[0]) {
                current = pair[1];
            }
        });
    }
    for (var i = 1; current && i < parts.length; i++) {
        var next = null;
        (current.c || []).forEach(function (pair) {
            if (!next && pair[0] === parts[i]) {
                next = pair[1];
            }
        });
        if (!next && current.t === "string" && parts[i] === "length") {
            next = { t: "number", d: String(current.d.length - 2) };
        }
        current = next;
    }
    return current;
}

function debugEntry() {
    var session = debugState.session;
    return session && session.index >= 0 ? session.trace[session.index] : null;
}

function startDebugging() {
    var session = debugState.session;
    if (session && session.state === "paused") {
        debugContinue();
        return;
    }
    if (session) {
        return;
    }
    var file = activeFile();
    if (!file || !/\.js$/i.test(file.name)) {
        notify("warning", "Open a JavaScript file to start debugging");
        return;
    }
    if (!inPacketTracer) {
        showPanel("output");
        addOutput("warn", "Preview mode: debugging runs only inside Packet Tracer. Open this window from Extensions > PTForge.");
        return;
    }
    var source = activeEditor().getValue();
    var built;
    try {
        built = instrumentScript(source);
    } catch (error) {
        showPanel("debug");
        var line = error.loc ? error.loc.line : 0;
        debugConsoleText("error", "SyntaxError: " + String(error.message).replace(/\s*\(\d+:\d+\)$/, ""), line);
        if (line) {
            activeEditor().goToLine(line);
        }
        return;
    }
    var list = [];
    var own = fileBreakpoints(file.id);
    Object.keys(own).forEach(function (line) {
        var bp = own[line];
        if (debugState.breakpointsActive && bp.enabled !== false) {
            list.push({ line: Number(line), condition: bp.condition, hit: bp.hit, log: bp.log });
        }
    });
    var resolved = breakpointConfig(built.steps, list);
    resolved.resolved.forEach(function (r) {
        if (own[r.line]) {
            own[r.line].verified = r.verified;
        }
    });
    refreshBreakpointGlyphs(file.id);
    debugState.session = {
        fileId: file.id,
        fileName: file.name,
        source: source,
        steps: built.steps,
        functions: built.functions,
        watches: debugState.watches.slice(),
        trace: [],
        logs: [],
        printedLogs: 0,
        output: [],
        index: -1,
        frame: 0,
        state: "running",
        started: new Date().getTime()
    };
    var config = { steps: built.steps, functions: built.functions, breakpoints: resolved.map, watches: debugState.watches.slice(), limit: debugState.limit };
    showView("debug");
    showPanel("debug");
    debugConsoleWrite("info", "<span class=\"dc-text\">Debugging " + escapeHtml(file.name) + (inPacketTracer ? "" : " (preview)") + "</span>");
    setDebugChrome(true);
    renderDebugView();
    if (!callEngine("debugRun", built.code, JSON.stringify(config))) {
        debugConsoleText("warning", "The debugger runs the script inside Packet Tracer. Open PTForge from Extensions in Packet Tracer to debug.");
        endDebugging(true);
    }
}

function receiveDebugTrace(data) {
    var session = debugState.session;
    if (!session) {
        return;
    }
    if (data.phase !== "run") {
        debugConsoleText("error", (data.error ? data.error.name + ": " + data.error.message : "The script could not start"));
        endDebugging(true);
        return;
    }
    session.trace = data.trace || [];
    session.logs = data.logs || [];
    session.error = data.error;
    session.truncated = data.truncated;
    session.total = data.steps;
    session.ms = data.ms;
    if (!debugState.pauseOnExceptions) {
        session.trace.forEach(function (entry) {
            if (entry.reason === "exception") {
                entry.reason = "";
            }
        });
    }
    if (session.truncated) {
        debugConsoleText("warning", "Recorded the first " + session.trace.length + " of " + session.total + " steps. Breakpoints later in the run still stop. Raise the step limit in Run and Debug for more.");
    }
    var first = firstStop(session.trace, debugState.stopOnEntry);
    if (first === -1) {
        finishDebugging();
        return;
    }
    pauseAt(first, debugState.stopOnEntry && first === 0 && !session.trace[0].reason ? "entry" : "");
}

function flushLogs(upTo) {
    var session = debugState.session;
    while (session.printedLogs < session.logs.length && (upTo === undefined || session.logs[session.printedLogs].n <= upTo)) {
        var item = session.logs[session.printedLogs++];
        debugConsoleText("log", item.text, item.line);
    }
}

function pauseAt(index, reason) {
    var session = debugState.session;
    var entry = session.trace[index];
    session.index = index;
    session.frame = 0;
    session.state = "paused";
    session.reason = reason || entry.reason || "step";
    flushLogs(entry.n);
    if (entry.reason === "exception" && entry.message) {
        debugConsoleText("error", "Uncaught " + entry.message, session.steps[entry.id].line);
    }
    if (entry.message && entry.reason !== "exception") {
        debugConsoleText("warning", entry.message, session.steps[entry.id].line);
    }
    showExecution();
    renderDebugView();
    setDebugChrome(true);
}

function showExecution() {
    var session = debugState.session;
    var entry = debugEntry();
    if (!session || !entry) {
        return;
    }
    if (app.active !== session.fileId && app.files[session.fileId]) {
        activate(session.fileId);
    }
    var editor = app.editors[session.fileId];
    if (!editor) {
        return;
    }
    var frames = callStackOf(entry, session.steps, session.functions);
    var frame = frames[Math.min(session.frame, frames.length - 1)];
    var message = entry.reason === "exception" && session.frame === 0 ? entry.message : "";
    editor.setExecution(frame.line, session.frame === 0 ? "top" : "frame", message);
}

function debugMove(mode) {
    var session = debugState.session;
    if (!session || session.state !== "paused") {
        return;
    }
    var next = traceStep(session.trace, session.index, mode);
    if (next === -1) {
        finishDebugging();
        return;
    }
    pauseAt(next, mode === "continue" || mode === "reverse" ? "" : "step");
}

function debugContinue() {
    debugMove("continue");
}

function finishDebugging() {
    var session = debugState.session;
    if (!session) {
        return;
    }
    flushLogs();
    session.output.forEach(function (text) {
        debugConsoleText("log", text);
    });
    if (session.error) {
        var line = session.trace.length ? session.steps[session.trace[session.trace.length - 1].id].line : 0;
        if (!debugState.pauseOnExceptions || !session.trace.some(function (e) { return e.reason === "exception"; })) {
            debugConsoleText("error", "Uncaught " + session.error.name + ": " + session.error.message, line);
        }
    }
    debugConsoleWrite("info", "<span class=\"dc-text\">Finished " + escapeHtml(session.fileName) + " in " + (session.ms || 0) + " ms, " + (session.total || 0) + " steps</span>");
    endDebugging(false);
}

function stopDebugging() {
    if (!debugState.session) {
        return;
    }
    debugConsoleWrite("info", "<span class=\"dc-text\">Debugging stopped</span>");
    endDebugging(false);
}

function endDebugging() {
    var session = debugState.session;
    debugState.session = null;
    if (session && app.editors[session.fileId]) {
        app.editors[session.fileId].setExecution(0);
    }
    hideDebugHover();
    setDebugChrome(false);
    renderDebugView();
}

function restartDebugging() {
    var session = debugState.session;
    if (session) {
        endDebugging(false);
        if (app.files[session.fileId] && app.active !== session.fileId) {
            activate(session.fileId);
        }
    }
    startDebugging();
}

function debugSourceChanged(fileId) {
    var session = debugState.session;
    if (session && session.fileId === fileId && session.state === "paused" && app.editors[fileId].getValue() !== session.source) {
        debugConsoleText("warning", "The file changed. Debugging stopped, start again to debug the new code.");
        endDebugging(false);
    }
}

function selectFrame(index) {
    var session = debugState.session;
    if (!session || session.state !== "paused") {
        return;
    }
    session.frame = index;
    showExecution();
    renderDebugView();
}

function setDebugChrome(active) {
    var bar = byId("debug-toolbar");
    var session = debugState.session;
    document.body.classList.toggle("debugging", Boolean(active && session));
    if (!bar) {
        return;
    }
    bar.classList.toggle("hidden", !(active && session));
    var paused = Boolean(session && session.state === "paused");
    Array.prototype.forEach.call(bar.querySelectorAll("[data-needs-pause]"), function (button) {
        button.classList.toggle("disabled", !paused);
    });
    var status = byId("sb-debug");
    if (status) {
        status.classList.toggle("hidden", !session);
        status.innerHTML = session ? icon("debug") + "<span>" + escapeHtml(session.fileName) + (paused ? " (paused)" : " (running)") + "</span>" : "";
    }
}

function treeRows(pairs, path, depth, out) {
    pairs.forEach(function (pair) {
        var key = path + "/" + pair[0];
        var preview = pair[1];
        var expandable = Boolean(preview.c && preview.c.length);
        var open = expandable && debugState.expanded[key];
        out.push("<div class=\"dv-row" + (expandable ? " expandable" : "") + "\" style=\"padding-left:" + (8 + depth * 12) + "px\"" + (expandable ? " data-dv-toggle=\"" + escapeHtml(key) + "\"" : "") + ">" +
            "<span class=\"dv-twisty" + (expandable ? (open ? " open" : "") : " none") + "\">" + icon("chevron") + "</span>" +
            "<span class=\"dv-name" + (/^\d+$/.test(pair[0]) || pair[0] === "length" ? " index" : "") + "\">" + escapeHtml(pair[0]) + "</span><span class=\"dv-sep\">: </span>" + previewHtml(preview) + "</div>");
        if (open) {
            treeRows(preview.c, key, depth + 1, out);
            if (preview.more) {
                out.push("<div class=\"dv-row dv-more\" style=\"padding-left:" + (20 + (depth + 1) * 12) + "px\">… " + preview.more + " more</div>");
            }
        }
    });
}

function renderVariables(entry) {
    if (!entry) {
        return "";
    }
    var out = [];
    entry.scopes.forEach(function (scope, i) {
        var key = "scope:" + i;
        var open = debugState.expanded[key] !== undefined ? debugState.expanded[key] : i === 0;
        out.push("<div class=\"dv-row dv-scope expandable\" data-dv-toggle=\"" + key + "\"><span class=\"dv-twisty" + (open ? " open" : "") + "\">" + icon("chevron") + "</span><span>" + escapeHtml(scope.name) + "</span></div>");
        if (open) {
            if (!scope.vars.length) {
                out.push("<div class=\"dv-row dv-more\" style=\"padding-left:28px\">No variables</div>");
            }
            treeRows(scope.vars, key, 1, out);
        }
    });
    return out.join("");
}

function renderWatches(entry, session) {
    var out = debugState.watches.map(function (expression, i) {
        var value = null;
        var note = "";
        if (entry) {
            value = resolveRecorded(expression, entry, session);
            if (!value) {
                note = session.watches.indexOf(expression) === -1 ? "not recorded, restart to evaluate" : "not available";
            }
        }
        var pairs = value ? [[expression, value]] : [];
        var rows = [];
        if (value) {
            treeRows(pairs, "watch:" + i, 0, rows);
        } else {
            rows.push("<div class=\"dv-row\" style=\"padding-left:8px\"><span class=\"dv-twisty none\">" + icon("chevron") + "</span><span class=\"dv-name\">" + escapeHtml(expression) + "</span>" + (entry ? "<span class=\"dv-sep\">: </span><span class=\"dv-value dv-unavailable\">" + escapeHtml(note) + "</span>" : "") + "</div>");
        }
        return "<div class=\"dv-watch\" data-watch=\"" + i + "\">" + rows.join("") + "<span class=\"dv-watch-acts\"><span data-watch-edit=\"" + i + "\" title=\"Edit Expression\">" + icon("edit") + "</span><span data-watch-remove=\"" + i + "\" title=\"Remove Expression\">" + icon("close") + "</span></span></div>";
    });
    if (debugState.addingWatch) {
        out.push("<div class=\"dv-watch-input\"><input id=\"watch-input\" spellcheck=\"false\" placeholder=\"Expression to watch\"></div>");
    }
    return out.join("") || "<div class=\"tree-hint\">Add an expression with the + button. Values are recorded while the script runs.</div>";
}

function renderCallStack(entry, session) {
    if (!entry) {
        return "";
    }
    var frames = callStackOf(entry, session.steps, session.functions);
    var label = { breakpoint: "PAUSED ON BREAKPOINT", exception: "PAUSED ON EXCEPTION", entry: "PAUSED ON ENTRY", step: "PAUSED ON STEP" }[debugReasons[session.reason] || "step"];
    return "<div class=\"cs-thread\"><span>" + escapeHtml(session.fileName) + "</span><span class=\"cs-state\">" + label + "</span></div>" + frames.map(function (frame, i) {
        return "<div class=\"cs-frame" + (i === session.frame ? " selected" : "") + "\" data-frame=\"" + i + "\"><span class=\"cs-name\">" + escapeHtml(frame.name) + "</span><span class=\"cs-loc\">" + escapeHtml(session.fileName) + " " + frame.line + "</span></div>";
    }).join("");
}

function renderBreakpoints() {
    var rows = ["<label class=\"bp-row bp-exc\"><input type=\"checkbox\" data-bp-exceptions" + (debugState.pauseOnExceptions ? " checked" : "") + "><span>Uncaught Exceptions</span></label>"];
    breakpointList().forEach(function (bp) {
        var file = app.files[bp.fileId];
        var detail = bp.log ? "Log: " + bp.log : bp.condition ? "When " + bp.condition : bp.hit ? "Hit count " + bp.hit : "";
        var dot = "bp-dot" + (bp.log ? " log" : bp.condition || bp.hit ? " cond" : "") + (bp.enabled && debugState.breakpointsActive ? "" : " off") + (bp.verified === false ? " unverified" : "");
        rows.push("<div class=\"bp-row\" data-bp-file=\"" + bp.fileId + "\" data-bp-line=\"" + bp.line + "\"><input type=\"checkbox\" data-bp-enable" + (bp.enabled ? " checked" : "") + "><span class=\"" + dot + "\"></span><span class=\"bp-file\">" + escapeHtml(file.name) + "</span><span class=\"bp-detail\">" + escapeHtml(detail) + "</span><span class=\"bp-line\">" + bp.line + "</span><span class=\"bp-remove\" data-bp-remove title=\"Remove Breakpoint\">" + icon("close") + "</span></div>");
    });
    return rows.join("");
}

function renderDebugView() {
    var host = byId("view-debug");
    if (!host) {
        return;
    }
    var session = debugState.session;
    var entry = debugEntry();
    var idle = !session;
    byId("debug-start").classList.toggle("hidden", !idle);
    byId("debug-sections").classList.toggle("hidden", idle && !breakpointList().length && !debugState.watches.length);
    byId("dbg-variables").innerHTML = entry ? renderVariables(entry) : "<div class=\"tree-hint\">" + (session ? "Running" : "Not paused") + "</div>";
    byId("dbg-watch").innerHTML = renderWatches(entry, session);
    byId("dbg-stack").innerHTML = entry ? renderCallStack(entry, session) : "<div class=\"tree-hint\">" + (session ? "Running" : "Not paused") + "</div>";
    byId("dbg-breakpoints").innerHTML = renderBreakpoints();
    byId("sec-variables").classList.toggle("hidden", idle);
    byId("sec-stack").classList.toggle("hidden", idle);
    var entryBox = byId("debug-entry");
    if (entryBox) {
        entryBox.checked = debugState.stopOnEntry;
    }
    var limit = byId("debug-limit");
    if (limit) {
        limit.value = String(debugState.limit);
    }
    var input = byId("watch-input");
    if (input) {
        input.focus();
    }
    var progress = byId("debug-progress");
    if (progress) {
        progress.textContent = session && session.index >= 0 ? "Step " + (session.index + 1) + " of " + session.trace.length : "";
    }
}

function onDebugViewClick(event) {
    var toggle = event.target.closest("[data-dv-toggle]");
    if (toggle) {
        var key = toggle.getAttribute("data-dv-toggle");
        var isScope = key.indexOf("scope:") === 0 && key.indexOf("/") === -1;
        var current = debugState.expanded[key] !== undefined ? debugState.expanded[key] : isScope && key === "scope:0";
        debugState.expanded[key] = !current;
        renderDebugView();
        return true;
    }
    var frame = event.target.closest("[data-frame]");
    if (frame) {
        selectFrame(Number(frame.getAttribute("data-frame")));
        return true;
    }
    var remove = event.target.closest("[data-watch-remove]");
    if (remove) {
        debugState.watches.splice(Number(remove.getAttribute("data-watch-remove")), 1);
        renderDebugView();
        persist();
        return true;
    }
    var edit = event.target.closest("[data-watch-edit]");
    if (edit) {
        var index = Number(edit.getAttribute("data-watch-edit"));
        var old = debugState.watches[index];
        debugState.watches.splice(index, 1);
        debugState.addingWatch = true;
        renderDebugView();
        byId("watch-input").value = old;
        return true;
    }
    var bpRow = event.target.closest("[data-bp-file]");
    if (bpRow) {
        var fileId = bpRow.getAttribute("data-bp-file");
        var line = Number(bpRow.getAttribute("data-bp-line"));
        if (event.target.closest("[data-bp-remove]")) {
            toggleBreakpoint(fileId, line);
        } else if (event.target.matches("[data-bp-enable]")) {
            setBreakpointEnabled(fileId, line, event.target.checked);
        } else {
            activate(fileId);
            app.editors[fileId].goToLine(line);
        }
        return true;
    }
    if (event.target.matches("[data-bp-exceptions]")) {
        debugState.pauseOnExceptions = event.target.checked;
        persist();
        return true;
    }
    return false;
}

function onWatchKey(event) {
    if (event.target.id !== "watch-input") {
        return false;
    }
    if (event.key === "Enter") {
        var value = event.target.value.trim();
        debugState.addingWatch = false;
        if (value) {
            debugState.watches.push(value);
        }
        renderDebugView();
        persist();
        return true;
    }
    if (event.key === "Escape") {
        debugState.addingWatch = false;
        renderDebugView();
        return true;
    }
    return false;
}

function addWatch(expression) {
    if (expression) {
        if (debugState.watches.indexOf(expression) === -1) {
            debugState.watches.push(expression);
        }
        showView("debug");
    } else {
        showView("debug");
        debugState.addingWatch = true;
    }
    renderDebugView();
    persist();
}

function evaluateInDebugConsole(text) {
    var expression = text.trim();
    if (!expression) {
        return;
    }
    debugState.consoleHistory.push(expression);
    debugState.consoleIndex = -1;
    debugConsoleWrite("input", "<span class=\"dc-text\">" + escapeHtml(expression) + "</span>");
    var session = debugState.session;
    var entry = debugEntry();
    if (session && entry) {
        var value = resolveRecorded(expression, entry, session);
        if (value) {
            var rows = [];
            treeRows([[expression, value]], "console:" + debugState.consoleHistory.length, 0, rows);
            debugConsoleWrite("value", rows.join(""));
        } else {
            var reason = "";
            try {
                evaluateRecorded(expression, entry);
            } catch (error) {
                reason = error && error.message ? error.message : String(error);
            }
            debugConsoleText("error", (reason ? reason + ". " : "") + "Add " + expression + " to Watch and restart to record its live value.");
        }
        return;
    }
    if (!inPacketTracer) {
        debugConsoleText("warning", "Expressions run inside Packet Tracer.");
        return;
    }
    callEngine("shellEval", "debug-console", globalizeDeclarations(expression));
}

function receiveConsoleShell(kind, data) {
    if (kind === "shell-log") {
        debugConsoleText("log", data.text);
    } else if (kind === "shell-result") {
        debugConsoleWrite(data.ok ? "value" : "error", data.ok && data.type !== "text" ? "<span class=\"dc-text\">" + colorizeValue(data.text) + "</span>" : "<span class=\"dc-text\">" + escapeHtml(data.text) + "</span>");
    }
}

function onDebugConsoleKey(event) {
    var input = event.target;
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        var value = input.value;
        input.value = "";
        evaluateInDebugConsole(value);
        return;
    }
    var list = debugState.consoleHistory;
    if ((event.key === "ArrowUp" || event.key === "ArrowDown") && list.length) {
        event.preventDefault();
        var index = debugState.consoleIndex === -1 ? list.length : debugState.consoleIndex;
        index += event.key === "ArrowUp" ? -1 : 1;
        if (index >= list.length) {
            debugState.consoleIndex = -1;
            input.value = "";
        } else {
            debugState.consoleIndex = Math.max(0, index);
            input.value = list[debugState.consoleIndex];
        }
    }
}

function showDebugHover(info) {
    var session = debugState.session;
    var entry = debugEntry();
    if (!info || !session || !entry || app.active !== session.fileId || session.frame !== 0) {
        if (!info) {
            debugState.hoverTimer = setTimeout(function () {
                var box = byId("debug-hover");
                if (box && !box.matches(":hover")) {
                    hideDebugHover();
                }
            }, 200);
        }
        return;
    }
    var value = resolveRecordedPath(info.expression, entry, session);
    if (!value) {
        hideDebugHover();
        return;
    }
    clearTimeout(debugState.hoverTimer);
    var box = byId("debug-hover");
    var rows = [];
    treeRows([[info.expression, value]], "hover", 0, rows);
    box.innerHTML = rows.join("");
    box.classList.remove("hidden");
    var rect = box.getBoundingClientRect();
    box.style.left = Math.max(4, Math.min(info.x, window.innerWidth - rect.width - 8)) + "px";
    box.style.top = (info.y + 14 + rect.height > window.innerHeight ? info.y - rect.height - 10 : info.y + 14) + "px";
}

function hideDebugHover() {
    var box = byId("debug-hover");
    if (box) {
        box.classList.add("hidden");
    }
}

function onDebugHoverClick(event) {
    var toggle = event.target.closest("[data-dv-toggle]");
    if (!toggle) {
        return;
    }
    var key = toggle.getAttribute("data-dv-toggle");
    debugState.expanded[key] = !debugState.expanded[key];
    var session = debugState.session;
    var entry = debugEntry();
    var box = byId("debug-hover");
    var first = box.querySelector(".dv-name");
    if (!session || !entry || !first) {
        return;
    }
    var expression = first.textContent;
    var rows = [];
    treeRows([[expression, resolveRecordedPath(expression, entry, session)]], "hover", 0, rows);
    box.innerHTML = rows.join("");
}

function debugSettings() {
    return {
        breakpoints: debugState.breakpoints,
        watches: debugState.watches,
        stopOnEntry: debugState.stopOnEntry,
        pauseOnExceptions: debugState.pauseOnExceptions,
        breakpointsActive: debugState.breakpointsActive,
        limit: debugState.limit
    };
}

function restoreDebugSettings(saved) {
    if (!saved) {
        return;
    }
    var clean = {};
    Object.keys(saved.breakpoints || {}).forEach(function (fileId) {
        clean[fileId] = {};
        Object.keys(saved.breakpoints[fileId]).forEach(function (line) {
            var bp = saved.breakpoints[fileId][line];
            clean[fileId][line] = { enabled: bp.enabled !== false, condition: bp.condition || "", hit: bp.hit || "", log: bp.log || "" };
        });
    });
    debugState.breakpoints = clean;
    debugState.watches = Array.isArray(saved.watches) ? saved.watches.filter(function (w) { return typeof w === "string"; }) : [];
    debugState.stopOnEntry = Boolean(saved.stopOnEntry);
    debugState.pauseOnExceptions = saved.pauseOnExceptions !== false;
    debugState.breakpointsActive = saved.breakpointsActive !== false;
    debugState.limit = Number(saved.limit) || 3000;
}

    </script>

    <script>
var viewTabs = {};

var calcTools = [
    { id: "ipv4", title: "IPv4 Subnet", info: "Network, broadcast, host range, mask and binary view of any address" },
    { id: "split", title: "Subnet Splitter", info: "Cut a network into equal subnets by prefix, subnet count or host count" },
    { id: "vlsm", title: "VLSM Planner", info: "Fit named subnets of different sizes into one block, largest first" },
    { id: "summary", title: "Route Summarization", info: "Smallest summary route and the exact set of prefixes for a list of networks" },
    { id: "range", title: "Range to CIDR", info: "Turn an address range into CIDR blocks and ACL entries" },
    { id: "wildcard", title: "Wildcard Mask", info: "Convert between prefix, subnet mask and wildcard mask" },
    { id: "ipv6", title: "IPv6 Address", info: "Compress, expand, prefix range, address type and solicited node" },
    { id: "eui64", title: "EUI-64", info: "Interface ID and link local address from a MAC address" },
    { id: "convert", title: "Number Converter", info: "Dotted decimal, decimal, hexadecimal and binary" }
];

var calcInputs = {
    ipv4: { address: "192.168.10.77/26" },
    split: { network: "10.10.0.0/22", mode: "prefix", value: "24" },
    vlsm: { base: "172.16.0.0/22", list: "Sales 120\nEngineering 60\nServers 25\nVoice 12\nLink-R1-R2 2\nLink-R2-R3 2" },
    summary: { list: "10.1.0.0/24\n10.1.1.0/24\n10.1.2.0/24\n10.1.3.0/24" },
    range: { from: "192.168.1.10", to: "192.168.1.100", acl: "10" },
    wildcard: { value: "255.255.252.0" },
    ipv6: { address: "2001:db8:acad:1::10/64" },
    eui64: { prefix: "2001:db8:acad:1::/64", mac: "0060.47CA.1B0E" },
    convert: { value: "192.168.1.1" }
};

function viewEscape(text) {
    return escapeHtml(String(text === undefined || text === null ? "" : text));
}

function isViewId(id) {
    return Boolean(id && viewTabs[id]);
}

function openViewTab(kind, key, title, data) {
    var id = "v-" + kind + (key ? "-" + key : "");
    if (!viewTabs[id]) {
        var root = document.createElement("div");
        root.className = "vt vt-" + kind + " hidden";
        byId("editors").appendChild(root);
        viewTabs[id] = { id: id, kind: kind, title: title, data: data, root: root, tool: "ipv4" };
    } else {
        viewTabs[id].title = title;
        if (data !== undefined) {
            viewTabs[id].data = data;
        }
    }
    renderViewTab(id);
    openTab(id);
    return id;
}

function showViewTab(id, visible) {
    var tab = viewTabs[id];
    if (tab) {
        tab.root.classList.toggle("hidden", !visible);
    }
}

function closeViewTab(id) {
    var tab = viewTabs[id];
    if (tab && tab.root.parentNode) {
        tab.root.parentNode.removeChild(tab.root);
    }
    delete viewTabs[id];
}

function viewTabIcon(kind) {
    return icon(kind === "calc" ? "calculator" : kind === "reach" ? "pulse" : "diff", "file-view");
}

function renderViewTab(id) {
    var tab = viewTabs[id];
    if (!tab) {
        return;
    }
    if (tab.kind === "calc") {
        renderCalculator(tab);
    } else if (tab.kind === "reach") {
        renderReachability(tab);
    } else if (tab.kind === "diff") {
        renderDiff(tab);
    }
}

function openCalculator(tool) {
    var id = openViewTab("calc", "", "Network Calculator");
    if (tool && tool !== viewTabs[id].tool) {
        viewTabs[id].tool = tool;
        renderCalculator(viewTabs[id]);
    }
    return id;
}

function kvGrid(pairs) {
    return "<div class=\"kv\">" + pairs.map(function (pair) {
        return "<div class=\"kv-key\">" + viewEscape(pair[0]) + "</div><div class=\"kv-val copyable\" title=\"Click to copy\">" + viewEscape(pair[1]) + "</div>";
    }).join("") + "</div>";
}

function dataTable(head, rows, css) {
    return "<table class=\"vt-table" + (css ? " " + css : "") + "\"><thead><tr>" + head.map(function (h) {
        return "<th>" + viewEscape(h) + "</th>";
    }).join("") + "</tr></thead><tbody>" + rows.map(function (row) {
        return "<tr>" + row.map(function (cell) {
            return "<td class=\"copyable\">" + viewEscape(cell) + "</td>";
        }).join("") + "</tr>";
    }).join("") + "</tbody></table>";
}

function codeBlock(lines, title) {
    return "<div class=\"vt-code\"><div class=\"vt-code-head\"><span>" + viewEscape(title) + "</span><span class=\"vt-code-acts\"><a data-calc-copy>Copy</a><a data-calc-insert>Insert into Editor</a></span></div><pre>" + viewEscape(lines.join("\n")) + "</pre></div>";
}

function field(label, key, value, wide, hint) {
    return "<label class=\"vt-field" + (wide ? " wide" : "") + "\"><span class=\"vt-label\">" + viewEscape(label) + "</span>" + (hint ? "<span class=\"vt-hint\">" + viewEscape(hint) + "</span>" : "") + "<input class=\"vt-input\" data-calc-key=\"" + key + "\" value=\"" + viewEscape(value) + "\" spellcheck=\"false\"></label>";
}

function areaField(label, key, value, hint) {
    return "<label class=\"vt-field wide\"><span class=\"vt-label\">" + viewEscape(label) + "</span>" + (hint ? "<span class=\"vt-hint\">" + viewEscape(hint) + "</span>" : "") + "<textarea class=\"vt-input vt-area\" data-calc-key=\"" + key + "\" spellcheck=\"false\">" + viewEscape(value) + "</textarea></label>";
}

function selectField(label, key, value, options) {
    return "<label class=\"vt-field\"><span class=\"vt-label\">" + viewEscape(label) + "</span><select class=\"vt-input vt-select\" data-calc-key=\"" + key + "\">" + options.map(function (o) {
        return "<option value=\"" + viewEscape(o[0]) + "\"" + (String(o[0]) === String(value) ? " selected" : "") + ">" + viewEscape(o[1]) + "</option>";
    }).join("") + "</select></label>";
}

function binaryBits(address, prefix) {
    var value = calcIpToInt(address);
    var html = "";
    for (var i = 0; i < 32; i++) {
        if (i && i % 8 === 0) {
            html += "<span class=\"bit-dot\">.</span>";
        }
        html += "<span class=\"bit " + (i < prefix ? "net" : "host") + "\">" + ((value >>> (31 - i)) & 1) + "</span>";
    }
    return html;
}

function calcForm(tool) {
    var v = calcInputs[tool];
    switch (tool) {
        case "ipv4":
            return field("Address", "address", v.address, true, "IP with prefix or mask: 10.1.2.3/20, 10.1.2.3 255.255.240.0, or just an address for its classful network");
        case "split":
            return field("Network", "network", v.network, false) + selectField("Split by", "mode", v.mode, [["prefix", "New prefix length"], ["subnets", "Number of subnets"], ["hosts", "Hosts per subnet"]]) + field("Value", "value", v.value, false);
        case "vlsm":
            return field("Address block", "base", v.base, false) + areaField("Subnets", "list", v.list, "One per line: name and hosts, for example Sales 120");
        case "summary":
            return areaField("Networks", "list", v.list, "One per line or separated by commas: 10.1.4.0/24 or 10.1.4.0 255.255.255.0");
        case "range":
            return field("First address", "from", v.from, false) + field("Last address", "to", v.to, false) + field("ACL number or name", "acl", v.acl, false);
        case "wildcard":
            return field("Prefix, mask or wildcard", "value", v.value, true, "/22, 255.255.252.0 or 0.0.3.255");
        case "ipv6":
            return field("IPv6 address", "address", v.address, true, "Any notation, with or without prefix: fe80::1, 2001:db8:acad:1::10/64");
        case "eui64":
            return field("Prefix", "prefix", v.prefix, false) + field("MAC address", "mac", v.mac, false, "0060.47CA.1B0E, 00-60-47-CA-1B-0E or 00:60:47:ca:1b:0e");
        case "convert":
            return field("Value", "value", v.value, true, "192.168.1.1, 3232235777, 0xC0A80101 or 0b1100...");
    }
    return "";
}

function calcResult(tool) {
    var v = calcInputs[tool];
    var html = "";
    switch (tool) {
        case "ipv4":
            var s = subnetInfo(v.address);
            html = kvGrid([
                ["Address", s.address], ["Network", s.network + "/" + s.prefix], ["Subnet mask", s.mask], ["Wildcard mask", s.wildcard],
                ["First host", s.firstHost], ["Last host", s.lastHost], ["Broadcast", s.broadcast], ["Usable hosts", s.hosts],
                ["Addresses", s.total], ["Class", s.ipClass], ["Scope", s.scope]
            ]);
            html += "<div class=\"vt-sub\">Binary</div><div class=\"bits\"><div class=\"bits-row\"><span class=\"bits-name\">Address</span>" + binaryBits(s.address, s.prefix) + "</div><div class=\"bits-row\"><span class=\"bits-name\">Mask</span>" + binaryBits(s.mask, s.prefix) + "</div><div class=\"bits-legend\"><span class=\"bit net\">1</span> network bits (" + s.prefix + ")<span class=\"bit host\">0</span> host bits (" + (32 - s.prefix) + ")</div></div>";
            html += codeBlock(["interface GigabitEthernet0/0", " ip address " + s.firstHost + " " + s.mask, "", "router ospf 1", " network " + s.network + " " + s.wildcard + " area 0"], "Cisco IOS");
            return html;
        case "split":
            var base = calcNetworkOf(v.network);
            var number = Number(v.value);
            if (!(number > 0) || Math.floor(number) !== number) {
                throw new Error("Value must be a whole number");
            }
            var prefix = v.mode === "prefix" ? number : v.mode === "subnets" ? base.prefix + Math.ceil(Math.log(number) / Math.LN2) : prefixForHosts(number);
            if (prefix < base.prefix || prefix > 32) {
                throw new Error("The new prefix /" + prefix + " does not fit inside /" + base.prefix);
            }
            var split = splitNetwork(v.network, prefix, 512);
            html = kvGrid([["New prefix", "/" + prefix], ["Subnet mask", split.mask], ["Subnets", split.count], ["Hosts each", split.hostsEach]]);
            html += dataTable(["#", "Network", "Host range", "Broadcast"], split.rows.map(function (r) { return [r.index, r.network, r.range, r.broadcast]; }));
            if (split.count > split.rows.length) {
                html += "<div class=\"vt-note\">Showing the first " + split.rows.length + " of " + split.count + " subnets</div>";
            }
            return html;
        case "vlsm":
            var plan = vlsmPlan(v.base, parseVlsmRequests(v.list));
            var used = plan.reduce(function (sum, r) { return sum + r.hosts + 2; }, 0);
            var total = calcBlockSize(calcNetworkOf(v.base).prefix);
            html = kvGrid([["Subnets", plan.length], ["Addresses used", used + " of " + total + " (" + Math.round(used * 100 / total) + "%)"], ["Free", total - used]]);
            html += dataTable(["Name", "Needed", "Network", "Mask", "Host range", "Broadcast", "Usable", "Spare"], plan.map(function (r) {
                return [r.name, r.needed, r.network, r.mask, r.range, r.broadcast, r.hosts, r.wasted];
            }));
            html += codeBlock(["VLSM plan for " + v.base].concat(plan.map(function (r) {
                return (r.name + "                ").substring(0, 16) + (r.network + "                  ").substring(0, 19) + r.range;
            })).map(function (line) { return "// " + line; }), "Plan as comment");
            return html;
        case "summary":
            var nets = parseNetworkList(v.list);
            var sum = summarizeRoutes(nets);
            html = kvGrid([["Summary route", sum.summary.network], ["Mask", sum.summary.mask], ["Wildcard", sum.summary.wildcard], ["Covers", sum.summary.size + " addresses"], ["Extra addresses", sum.summary.extra]]);
            if (sum.summary.extra) {
                html += "<div class=\"vt-note warn\">The summary also covers " + sum.summary.extra + " addresses that are not in the list. The exact set below covers only the listed networks.</div>";
            }
            html += "<div class=\"vt-sub\">Exact prefixes</div>" + dataTable(["Network", "Mask", "Wildcard", "Addresses"], sum.exact.map(function (r) { return [r.network, r.mask, r.wildcard, r.size]; }));
            var sn = sum.summary.network.split("/")[0];
            html += codeBlock(["ip route " + sn + " " + sum.summary.mask + " <next-hop>", "", "router ospf 1", " area 1 range " + sn + " " + sum.summary.mask, "", "interface GigabitEthernet0/0", " ip summary-address eigrp 1 " + sn + " " + sum.summary.mask], "Cisco IOS");
            return html;
        case "range":
            var blocks = rangeToCidrs(v.from, v.to);
            var acl = String(v.acl || "10").trim();
            var numbered = /^\d+$/.test(acl);
            html = kvGrid([["Blocks", blocks.length], ["Addresses", blocks.reduce(function (n, b) { return n + b.size; }, 0)]]);
            html += dataTable(["Network", "Mask", "Wildcard", "ACL entry", "Addresses"], blocks.map(function (b) { return [b.network, b.mask, b.wildcard, b.acl, b.size]; }));
            html += codeBlock(numbered ? blocks.map(function (b) { return "access-list " + acl + " permit " + b.acl; }) : ["ip access-list standard " + acl].concat(blocks.map(function (b) { return " permit " + b.acl; })), "Access list");
            return html;
        case "wildcard":
            var w = wildcardFor(v.value);
            var block = calcBlockSize(w.prefix);
            html = kvGrid([["Prefix", "/" + w.prefix], ["Subnet mask", w.mask], ["Wildcard mask", w.wildcard], ["Addresses", block], ["Usable hosts", w.prefix >= 31 ? (w.prefix === 31 ? 2 : 1) : block - 2]]);
            html += codeBlock(["access-list 10 permit 10.0.0.0 " + w.wildcard, "router ospf 1", " network 10.0.0.0 " + w.wildcard + " area 0"], "Usage");
            return html;
        case "ipv6":
            var six = ipv6Info(v.address);
            return kvGrid([["Compressed", six.compressed], ["Expanded", six.expanded], ["Prefix", "/" + six.prefix], ["Network", six.network], ["First address", six.first], ["Last address", six.last], ["Type", six.type], ["/64 subnets", six.subnets64], ["Interface ID", six.interfaceId], ["Solicited node", six.solicitedNode]]);
        case "eui64":
            var e = eui64(v.prefix, v.mac);
            return kvGrid([["Interface ID", e.interfaceId], ["Global address", e.address], ["Expanded", e.expanded], ["Link local", e.linkLocal], ["U/L bit", e.flippedBit]]) +
                codeBlock(["interface GigabitEthernet0/0", " ipv6 address " + calcInputs.eui64.prefix.replace(/\s+/g, "") + " eui-64"], "Cisco IOS");
        case "convert":
            var c = convertNumber(v.value);
            return kvGrid([["Dotted decimal", c.ip], ["Decimal", c.decimal], ["Hexadecimal", c.hex], ["Hex octets", c.hexOctets], ["Binary", c.binary], ["Significant bits", c.bits]]);
    }
    return html;
}

function renderCalculator(tab) {
    var tool = tab.tool;
    var info = calcTools.filter(function (t) { return t.id === tool; })[0];
    tab.root.innerHTML = "<div class=\"calc-layout\"><nav class=\"calc-nav\">" + calcTools.map(function (t) {
        return "<div class=\"calc-nav-item" + (t.id === tool ? " active" : "") + "\" data-calc-tool=\"" + t.id + "\">" + viewEscape(t.title) + "</div>";
    }).join("") + "</nav><div class=\"calc-page\"><div class=\"calc-inner\"><h1 class=\"vt-title\">" + viewEscape(info.title) + "</h1><div class=\"vt-desc\">" + viewEscape(info.info) + "</div><div class=\"vt-form\">" + calcForm(tool) + "</div><div class=\"calc-result\"></div></div></div></div>";
    refreshCalcResult(tab);
}

function refreshCalcResult(tab) {
    var box = tab.root.querySelector(".calc-result");
    if (!box) {
        return;
    }
    try {
        box.innerHTML = calcResult(tab.tool);
    } catch (error) {
        box.innerHTML = "<div class=\"vt-error\">" + icon("error") + "<span>" + viewEscape(error.message) + "</span></div>";
    }
}

function onViewInput(event) {
    var target = event.target;
    var key = target.getAttribute && target.getAttribute("data-calc-key");
    var tabRoot = target.closest && target.closest(".vt-calc");
    if (!key || !tabRoot) {
        return false;
    }
    var tab = viewTabs["v-calc"];
    calcInputs[tab.tool][key] = target.value;
    refreshCalcResult(tab);
    return true;
}

function onViewClick(event) {
    var target = event.target;
    var root = target.closest(".vt");
    if (!root) {
        return false;
    }
    var toolItem = target.closest("[data-calc-tool]");
    if (toolItem) {
        var tab = viewTabs["v-calc"];
        tab.tool = toolItem.getAttribute("data-calc-tool");
        renderCalculator(tab);
        var first = tab.root.querySelector(".vt-input");
        if (first) {
            first.focus();
        }
        return true;
    }
    if (target.closest("[data-calc-copy]") || target.closest("[data-calc-insert]")) {
        var text = target.closest(".vt-code").querySelector("pre").textContent;
        if (target.closest("[data-calc-copy]")) {
            copyText(text);
        } else {
            insertIntoEditor(text + "\n");
        }
        return true;
    }
    var copy = target.closest(".copyable");
    if (copy && !String(window.getSelection ? window.getSelection() : "")) {
        copyText(copy.textContent);
        return true;
    }
    var action = target.closest("[data-view-action]");
    if (action) {
        runViewAction(action.getAttribute("data-view-action"), action);
        return true;
    }
    return false;
}

function runViewAction(action, el) {
    if (action === "reach-run") {
        runReachability();
    } else if (action === "reach-csv") {
        var tab = viewTabs["v-reach"];
        var rows = [["source", "target", "ip", "state", "percent", "avg_ms"]].concat(tab.data.rows.map(function (r) {
            return [r.source, r.target, r.ip, r.state, r.percent === null ? "" : r.percent, r.rtt ? r.rtt.avg : ""];
        }));
        copyText(rows.map(function (r) { return r.join(","); }).join("\n"));
    } else if (action === "diff-hunks") {
        var diff = viewTabs[el.getAttribute("data-tab")];
        diff.full = !diff.full;
        renderDiff(diff);
    } else if (action === "diff-refresh") {
        var d = viewTabs[el.getAttribute("data-tab")];
        compareSnapshotsUi(d.data.from, d.data.to === "current" ? "" : d.data.to);
    }
}

function deviceOfIp(ip) {
    var found = "";
    ((app.devices && app.devices.devices) || []).forEach(function (d) {
        (d.ports || []).forEach(function (p) {
            if (!found && String(p.ip).split("/")[0] === ip) {
                found = d.name;
            }
        });
    });
    return found;
}

function runReachability() {
    if (!callEngine("editorReachability")) {
        notify("warning", "Reachability tests run inside Packet Tracer");
        return;
    }
    var tab = viewTabs["v-reach"];
    if (tab) {
        tab.running = true;
        renderReachability(tab);
    }
    setRunning(true, "Pinging");
}

function receiveReachability(report) {
    report.time = timeNow();
    var id = openViewTab("reach", "", "Reachability", report);
    viewTabs[id].running = false;
    renderReachability(viewTabs[id]);
    setRunning(false);
    if (typeof terminalReachability === "function") {
        terminalReachability(report);
    }
}

function reachCellClass(row) {
    return row ? "rc rc-" + row.state : "rc rc-self";
}

function renderReachability(tab) {
    var r = tab.data || { rows: [], sources: [], targets: [], ok: 0, partial: 0, failed: 0, unknown: 0, total: 0 };
    var targets = r.targets && r.targets.length ? r.targets : [];
    var byKey = {};
    r.rows.forEach(function (row) {
        byKey[row.source + "|" + row.ip] = row;
        byKey[row.source + "|" + row.target] = row;
        if (targets.indexOf(row.target) === -1) {
            targets.push(row.target);
        }
    });
    var sources = r.sources && r.sources.length ? r.sources : r.rows.map(function (row) { return row.source; }).filter(function (s, i, list) { return list.indexOf(s) === i; });
    var head = "<div class=\"vt-header\"><div><h1 class=\"vt-title\">Reachability</h1><div class=\"vt-desc\">" + (tab.running ? "Pinging every address from every router and switch..." : r.total + " pings from " + sources.length + " devices to " + targets.length + " addresses" + (r.time ? ", " + viewEscape(r.time) : "")) + "</div></div><div class=\"vt-actions\"><button class=\"btn primary\" data-view-action=\"reach-run\"" + (tab.running ? " disabled" : "") + ">" + icon("refresh") + "Run Again</button><button class=\"btn\" data-view-action=\"reach-csv\">Copy as CSV</button></div></div>";
    var chips = "<div class=\"chips\"><span class=\"chip ok\"><i></i>" + r.ok + " reachable</span><span class=\"chip partial\"><i></i>" + r.partial + " partial</span><span class=\"chip failed\"><i></i>" + r.failed + " failed</span><span class=\"chip unknown\"><i></i>" + r.unknown + " unknown</span></div>";
    var grid = "<div class=\"matrix-wrap\"><table class=\"matrix\"><thead><tr><th class=\"corner\">source \\ target</th>" + targets.map(function (t) {
        var owner = deviceOfIp(t);
        return "<th><span class=\"mx-ip\">" + viewEscape(t) + "</span>" + (owner ? "<span class=\"mx-owner\">" + viewEscape(owner) + "</span>" : "") + "</th>";
    }).join("") + "</tr></thead><tbody>" + sources.map(function (s) {
        return "<tr><th class=\"mx-src\">" + viewEscape(s) + "</th>" + targets.map(function (t) {
            var row = byKey[s + "|" + t];
            var label = !row ? "" : row.state === "ok" || row.state === "partial" ? row.percent + "%" : row.state === "failed" ? "0%" : row.state === "sent" ? "sent" : "?";
            var tip = row ? row.source + " -> " + row.target + ": " + row.state + (row.rtt ? ", avg " + row.rtt.avg + " ms" : "") + (row.output ? "\n\n" + row.output : "") : "own address";
            return "<td class=\"" + reachCellClass(row) + "\" title=\"" + viewEscape(tip) + "\">" + viewEscape(label) + (row && row.rtt ? "<small>" + row.rtt.avg + " ms</small>" : "") + "</td>";
        }).join("") + "</tr>";
    }).join("") + "</tbody></table></div>";
    var problems = r.rows.filter(function (row) { return row.state === "failed" || row.state === "partial" || row.state === "error"; });
    var list = problems.length ? "<div class=\"vt-sub\">Problems</div>" + dataTable(["Source", "Target", "Address", "State", "Detail"], problems.map(function (row) {
        return [row.source, row.target, row.ip, row.state, (row.output || "").split("\n").filter(function (l) { return /Success rate|timed out|Unreachable|Invalid|%/.test(l); }).slice(0, 1).join(" ") || row.state];
    })) : r.rows.length ? "<div class=\"vt-note ok\">" + icon("checks") + "Every tested address answered.</div>" : "";
    tab.root.innerHTML = "<div class=\"vt-page\">" + head + chips + (r.rows.length ? grid : "<div class=\"vt-note\">No results yet.</div>") + list + "</div>";
}

function compareSnapshotsUi(from, to) {
    if (!callEngine("editorSnapshot", "diff", from, to || "")) {
        notify("warning", "Snapshots need Packet Tracer");
    }
}

function receiveSnapshotDiff(result) {
    var key = (result.from + "-" + result.to).replace(/[^\w-]/g, "_");
    var id = openViewTab("diff", key, result.from + " \u2194 " + result.to, result);
    renderDiff(viewTabs[id]);
}

function diffHunks(lines, context) {
    var keep = lines.map(function () { return false; });
    lines.forEach(function (line, i) {
        if (line.op !== " ") {

        rows.push("<tr class=\"" + css + "\"><td class=\"dl-no\">" + (line.op === "+" ? "" : oldNo) + "</td><td class=\"dl-no\">" + (line.op === "-" ? "" : newNo) + "</td><td class=\"dl-op\">" + (line.op === " " ? "" : line.op) + "</td><td class=\"dl-text\">" + viewEscape(line.text) + "</td></tr>");
    });

var pluginPermissionInfo = {

    cli: ["Send IOS commands", "Run configuration commands on routers and switches and control simulation mode"],
    files: ["Read and write files", "Open, save and delete files on this computer and open or save Packet Tracer projects"],

function pluginInitial(p) {
    return viewEscape(((p.name || p.id || "?").replace(/[^A-Za-z0-9]/g, "") || "?").charAt(0).toUpperCase());
}

function pluginHue(p) {
    var text = p.id || p.file || "";
    var hash = 0;
    for (var i = 0; i < text.length; i++) {
        hash = (hash * 31 + text.charCodeAt(i)) % 360;
    }
    return hash;
}

function renderPlugins() {
    var box = byId("plugin-list");
    if (!box) {
        return;
    }
    var data = app.plugins;
    byId("plugin-folder").textContent = data ? data.folder : "";
    byId("plugin-folder").title = data ? data.folder : "";

        box.innerHTML = "<div class=\"tree-hint\">Plugins load inside Packet Tracer. Put <code>.pf</code> files in the plugin folder, then enable them here.</div>";
        return;

function icon(name, css) {
    return "<svg class=\"ico" + (css ? " " + css : "") + "\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">" + (icons[name] || "") + "</svg>";
}

function byId(id) {
    return document.getElementById(id);
}

function storeData(key, value) {
    if (typeof $putData === "function") {
        $putData(key, value);
        return;
    }
    try {
        window.localStorage.setItem(key, value);
    } catch (error) {
        return;
    }
}

function readData(key, callback) {
    if (typeof $getData === "function") {
        $getData(key).then(function (value) {
            callback(value || "");
        }, function () {
            callback("");
        });
        return;
    }
    var value = "";
    try {
        value = window.localStorage.getItem(key) || "";
    } catch (error) {
        value = "";
    }
    callback(value);
}

function callEngine(name) {
    var args = Array.prototype.slice.call(arguments, 1).map(function (value) {
        return encodeURIComponent(String(value));
    });
    if (!inPacketTracer) {
        return false;
    }
    $se.apply(null, [name].concat(args));
    return true;
}

function sendScript(code) {
    if (!inPacketTracer) {
        return false;
    }
    $se("runCode", encodeURIComponent(code));
    return true;
}

function persist() {
    clearTimeout(app.persistTimer);
    app.persistTimer = setTimeout(persistNow, 300);
}

function persistNow() {
    var fileTabs = app.open.filter(function (id) {
        return !!app.files[id];
    });
    var files = app.order.map(function (id) {
        var f = app.files[id];
        return { id: f.id, name: f.name, path: f.path, text: f.text, saved: f.saved, source: f.source };
    });
    storeData(storageKey, JSON.stringify({
        version: 2,
        files: files,
        open: fileTabs,
        active: app.files[app.active] ? app.active : fileTabs[0] || null,
        nextId: app.nextId,
        folder: app.folder,
        fontSize: app.fontSize,
        view: app.view,
        sidebarVisible: app.sidebarVisible,
        sidebarWidth: app.sidebarWidth,
        panelVisible: app.panelVisible,
        panelHeight: app.panelHeight,
        panelTab: app.panelTab,
        debug: debugSettings(),
        termHistory: terminalState.history.slice(-300)
    }));
}

function timeNow() {
    var d = new Date();
    function pad(n) {
        return n < 10 ? "0" + n : String(n);
    }
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function fileIcon(name) {
    return /\.js$/i.test(name) ? icon("jsFile", "file-js") : icon("textFile", "file-txt");
}

function isDirty(file) {
    return file.text !== file.saved;
}

function uniqueName(base) {
    var taken = {};
    app.order.forEach(function (id) {
        if (app.files[id].source === "workspace") {
            taken[app.files[id].name.toLowerCase()] = true;
        }
    });
    if (!taken[base.toLowerCase()]) {
        return base;
    }
    var stem = base.replace(/\.[^.]+$/, "");
    var ext = base.substring(stem.length) || ".js";
    for (var i = 2; ; i++) {
        if (!taken[(stem + "-" + i + ext).toLowerCase()]) {
            return stem + "-" + i + ext;
        }
    }
}

function createFile(props) {
    var id = "f" + app.nextId++;
    app.files[id] = {
        id: id,
        name: props.name,
        path: props.path || "",
        text: props.text || "",
        saved: props.saved === undefined ? props.text || "" : props.saved,
        source: props.source || "workspace"
    };
    app.order.push(id);
    return id;
}

function newFile(name, text) {
    var id = createFile({ name: uniqueName(name || "untitled.js"), text: text || "", saved: "" });
    openTab(id);
    return id;
}

function findFileByPath(path) {
    for (var i = 0; i < app.order.length; i++) {
        var f = app.files[app.order[i]];
        if (f.path && f.path === path) {
            return f;
        }
    }
    return null;
}

function openDiskFile(path, name, text, source) {
    var existing = findFileByPath(path);
    if (existing) {
        if (!isDirty(existing)) {
            existing.text = text;
            existing.saved = text;
            if (app.editors[existing.id]) {
                app.editors[existing.id].setValue(text);
            }
        }
        openTab(existing.id);
        return existing.id;
    }
    var id = createFile({ name: name, path: path, text: text, saved: text, source: source || "disk" });
    openTab(id);
    return id;
}

function ensureEditor(id) {
    if (app.editors[id]) {
        return app.editors[id];
    }
    var file = app.files[id];
    var editor = new CodeEditor(byId("editors"), {
        catalog: functionCatalog,
        fontSize: app.fontSize,
        onChange: function (ed) {
            var wasDirty = isDirty(file);
            file.text = ed.getValue();
            if (wasDirty !== isDirty(file)) {
                renderTabs();
                renderExplorer();
            }
            scheduleLint();
            persist();
            debugSourceChanged(id);
            if (app.findOpen) {
                refreshFindCount();
            }
        },
        onGlyphClick: function (line) {
            toggleBreakpoint(id, line);
        },
        onGutterMenu: function (line, event) {
            breakpointMenu(id, line, event);
        },
        onLinesShift: function (change) {
            shiftBreakpoints(id, change);
        },
        onHover: function (info) {
            showDebugHover(info);
        },
        onCursor: function (pos, selected) {
            byId("sb-position").textContent = "Ln " + pos.line + ", Col " + pos.column + (selected ? " (" + selected + " selected)" : "");
            var problem = editor.problemAt(pos.line);
            byId("sb-message").textContent = problem ? problem.message : "";
        }
    });
    editor.setValue(file.text);
    editor.show(false);
    app.editors[id] = editor;
    refreshBreakpointGlyphs(id);
    return editor;
}

function activeEditor() {
    return app.active ? app.editors[app.active] : null;
}

function activeFile() {
    return app.active ? app.files[app.active] : null;
}

function openTab(id) {
    if (app.open.indexOf(id) === -1) {
        app.open.push(id);
    }
    activate(id);
}

function tabInfo(id) {
    if (isViewId(id)) {
        var v = viewTabs[id];
        return { name: v.title, icon: viewTabIcon(v.kind), dirty: false, title: v.title };
    }
    var f = app.files[id];
    return { name: f.name, icon: fileIcon(f.name), dirty: isDirty(f), title: f.path || f.name };
}

function activate(id) {
    app.active = id;
    closeBreakpointWidget();
    hideDebugHover();
    Object.keys(app.editors).forEach(function (key) {
        if (key !== id) {
            app.editors[key].show(false);
        }
    });
    Object.keys(viewTabs).forEach(function (key) {
        showViewTab(key, key === id);
    });
    var hasFile = !!id && !!app.files[id];
    byId("welcome").classList.toggle("hidden", hasFile || isViewId(id));
    byId("editor-title").classList.toggle("hidden", !hasFile);
    if (isViewId(id) && app.findOpen) {
        closeFind();
    }
    if (hasFile) {
        var editor = ensureEditor(id);
        editor.show(true);
        setTimeout(function () {
            editor.focus();
        }, 0);
        if (app.findOpen) {
            runFind();
        }
    }
    renderTabs();
    renderExplorer();
    renderBreadcrumbs();
    lintNow();
    persist();
}

function closeTab(id, force) {
    if (isViewId(id)) {
        var at = app.open.indexOf(id);
        if (at !== -1) {
            app.open.splice(at, 1);
        }
        closeViewTab(id);
        if (app.active === id) {
            activate(app.open[Math.min(at, app.open.length - 1)] || null);
        } else {
            renderTabs();
            renderExplorer();
        }
        return;
    }
    var file = app.files[id];
    if (!file) {
        return;
    }
    if (!force && isDirty(file) && file.source !== "workspace") {
        showDialog({
            title: "Do you want to save the changes you made to " + file.name + "?",
            message: "Your changes will be lost if you don't save them.",
            buttons: ["Save", "Don't Save", "Cancel"]
        }, function (choice) {
            if (choice === 0) {
                file.closeAfterSave = true;
                saveFile(id);
            } else if (choice === 1) {
                file.text = file.saved;
                if (app.editors[id]) {
                    app.editors[id].setValue(file.saved);
                }
                closeTab(id, true);
            }
        });
        return;
    }
    var index = app.open.indexOf(id);
    if (index !== -1) {
        app.open.splice(index, 1);
    }
    if (app.editors[id]) {
        app.editors[id].root.parentNode.removeChild(app.editors[id].root);
        delete app.editors[id];
    }
    if (file.source !== "workspace") {
        if (isDirty(file) && force !== true) {
            return;
        }
        delete app.files[id];
        app.order.splice(app.order.indexOf(id), 1);
    }
    if (app.active === id) {
        activate(app.open[Math.min(index, app.open.length - 1)] || null);
    } else {
        renderTabs();
        renderExplorer();
        persist();
    }
}

function cycleTab(step) {
    if (!app.open.length) {
        return;
    }
    var index = app.open.indexOf(app.active);
    activate(app.open[(index + step + app.open.length) % app.open.length]);
}

function renderTabs() {
    var bar = byId("tabs");
    bar.innerHTML = app.open.map(function (id) {
        var info = tabInfo(id);
        var css = "tab" + (id === app.active ? " active" : "") + (info.dirty ? " dirty" : "");
        return "<div class=\"" + css + "\" data-id=\"" + id + "\" title=\"" + escapeHtml(info.title) + "\">" + info.icon +
            "<span class=\"tab-name\">" + escapeHtml(info.name) + "</span><span class=\"tab-close\" data-close=\"" + id + "\">" + icon("close") + "</span></div>";
    }).join("");
    var active = bar.querySelector(".tab.active");
    if (active && active.scrollIntoView) {
        active.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
}

function renderBreadcrumbs() {
    var f = activeFile();
    var crumbs = byId("breadcrumbs");
    if (!f) {
        crumbs.innerHTML = "";
        return;
    }
    var parts = f.source === "workspace" ? ["Workspace", f.name] : (f.path || f.name).split(/[\\/]/).filter(Boolean).slice(-3);
    crumbs.innerHTML = parts.map(function (p, i) {
        return (i === parts.length - 1 ? fileIcon(f.name) : "") + "<span>" + escapeHtml(p) + "</span>";
    }).join(icon("chevron", "crumb-sep"));
}

function scheduleLint() {
    clearTimeout(app.lintTimer);
    app.lintTimer = setTimeout(lintNow, 350);
}

function lintNow() {
    var editor = activeEditor();
    app.problems = editor ? findProblems(editor.getValue(), functionCatalog) : [];
    if (editor) {
        editor.setProblems(app.problems);
    }
    renderProblems();
}

function renderProblems() {
    var errors = app.problems.filter(function (p) {
        return p.severity === "error";
    }).length;
    var warnings = app.problems.length - errors;
    byId("sb-errors").innerHTML = icon("error") + errors + " " + icon("warning") + warnings;
    var badge = byId("problems-badge");
    badge.textContent = app.problems.length;
    badge.classList.toggle("hidden", !app.problems.length);
    var f = activeFile();
    var body = byId("panel-problems");
    if (!app.problems.length) {
        body.innerHTML = "<div class=\"empty\">No problems have been detected in the workspace.</div>";
        return;
    }
    body.innerHTML = "<div class=\"problem-file\">" + icon("chevron", "open") + fileIcon(f.name) + "<b>" + escapeHtml(f.name) + "</b><span class=\"count\">" + app.problems.length + "</span></div>" +
        app.problems.map(function (p, i) {
            return "<div class=\"problem\" data-index=\"" + i + "\">" + icon(p.severity, "sev-" + p.severity) + "<span class=\"msg\">" + escapeHtml(p.message) +
                "</span><span class=\"src\">" + p.source + "</span><span class=\"loc\">[Ln " + p.line + ", Col " + p.column + "]</span>" +
                (p.suggestion ? "<button class=\"quickfix\" data-fix=\"" + i + "\">Change to " + escapeHtml(p.suggestion) + "</button>" : "") + "</div>";
        }).join("");
}

function applyQuickFix(index) {
    var p = app.problems[index];
    var editor = activeEditor();
    if (!p || !editor || !p.suggestion) {
        return;
    }
    editor.replaceRange(p.offset, p.offset + p.length, p.suggestion);
    lintNow();
}

function addOutput(kind, text) {
    var body = byId("panel-output");
    var row = document.createElement("div");
    row.className = "out " + kind;
    row.innerHTML = "<span class=\"out-time\">[" + timeNow() + "]</span><span class=\"out-kind\">" + kind + "</span>";
    var pre = document.createElement("pre");
    pre.textContent = text;
    row.appendChild(pre);
    body.appendChild(row);
    while (body.children.length > 800) {
        body.removeChild(body.firstChild);
    }
    body.scrollTop = body.scrollHeight;
}

function setRunning(running, text) {
    app.running = running;
    byId("statusbar").classList.toggle("running", running);
    byId("sb-run").innerHTML = running ? "<span class=\"spin\"></span>Running script" : text || "";
}

function receiveOutput(message) {
    var kind = message.kind;
    var data = null;
    if (/^(file-opened|folder-opened|file-saved|bridge-error|devices|report|audit|shell-result|shell-log|shell-cli|debug-trace|reachability|snapshots|snapshot-diff|plugins)$/.test(kind)) {
        try {
            data = JSON.parse(message.text);
        } catch (error) {
            addOutput("error", "Bad message from Packet Tracer: " + kind);
            return;
        }
    }
    if (/^shell-/.test(kind)) {
        if (data.id === "debug-console") {
            receiveConsoleShell(kind, data);
        } else {
            routeShellMessage(kind, data);
        }
        return;
    }
    if (kind === "debug-trace") {
        receiveDebugTrace(data);
        return;
    }
    if (kind === "reachability") {
        receiveReachability(data);
        return;
    }
    if (kind === "plugins") {
        receivePlugins(data);
        return;
    }
    if (kind === "snapshots") {
        app.snapshots = data;
        renderSnapshots();
        return;
    }
    if (kind === "snapshot-diff") {
        receiveSnapshotDiff(data);
        return;
    }
    if (debugState.session && (kind === "log" || kind === "result")) {
        debugState.session.output.push(message.text);
    }
    if (kind === "file-opened") {
        openDiskFile(data.path, data.name, data.text, "disk");
        notify("info", "Opened " + data.path);
    } else if (kind === "folder-opened") {
        app.folder = data;
        showView("explorer");
        renderExplorer();
        persist();
    } else if (kind === "file-saved") {
        fileSaved(data);
    } else if (kind === "bridge-error") {
        addOutput("error", data.action + ": " + data.message);
        notify("error", data.message);
        if (data.action === "reachability") {
            setRunning(false, "");
            if (viewTabs["v-reach"]) {
                viewTabs["v-reach"].running = false;
                renderReachability(viewTabs["v-reach"]);
            }
        }
    } else if (kind === "devices") {
        app.devices = data;
        renderDevices();
    } else if (kind === "report" || kind === "audit") {
        app.reports.unshift({ kind: kind, data: data, time: timeNow() });
        app.reports = app.reports.slice(0, 20);
        renderChecks();
        showPanel("checks");
        setRunning(false, "");
    } else if (kind === "script") {
        newFile("from-cli.js", message.text);
        notify("info", "Created a script from the command log");
    } else {
        addOutput(kind, message.text);
        if (kind === "error") {
            setRunning(false, "");
            byId("sb-run").innerHTML = icon("error") + "Failed";
            if (app.panelTab !== "output") {
                showPanel("output");
            }
        } else if (kind === "done") {
            setRunning(false, icon("checks") + message.text);
        }
    }
}

function fileSaved(data) {
    var file = app.files[data.id];
    if (!file) {
        return;
    }
    var savedText = app.pendingSaves[data.id];
    delete app.pendingSaves[data.id];
    file.path = data.path;
    file.name = data.name;
    file.source = "disk";
    file.saved = savedText === undefined ? file.text : savedText;
    renderTabs();
    renderExplorer();
    renderBreadcrumbs();
    persist();
    notify("info", "Saved " + data.path);
    if (file.closeAfterSave && !isDirty(file)) {
        file.closeAfterSave = false;
        closeTab(file.id, true);
    }
}

function saveFile(id) {
    var file = app.files[id || app.active];
    if (!file) {
        return;
    }
    if (file.source === "workspace") {
        file.saved = file.text;
        persistNow();
        renderTabs();
        renderExplorer();
        if (file.closeAfterSave) {
            closeTab(file.id, true);
        }
        return;
    }
    if (file.source === "disk" && inPacketTracer) {
        app.pendingSaves[file.id] = file.text;
        callEngine("editorSaveFile", file.id, file.path, file.text);
        return;
    }
    downloadText(file.name, file.text);
    file.saved = file.text;
    renderTabs();
    renderExplorer();
    persist();
    if (file.closeAfterSave) {
        closeTab(file.id, true);
    }
}

function saveFileAs(id) {
    var file = app.files[id || app.active];
    if (!file) {
        return;
    }
    if (inPacketTracer) {
        app.pendingSaves[file.id] = file.text;
        callEngine("editorSaveFileAs", file.id, file.name, file.text);
        return;
    }
    showDialog({ title: "Save As", message: "File name", input: file.name, buttons: ["Download", "Cancel"] }, function (choice, value) {
        if (choice === 0 && value) {
            downloadText(value, file.text);
        }
    });
}

function saveAll() {
    app.order.slice().forEach(function (id) {
        if (isDirty(app.files[id])) {
            saveFile(id);
        }
    });
}

function downloadText(name, text) {
    var blob = new Blob([text], { type: "text/javascript" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = name;
    document.body.appendChild(link);
    link.click();
    setTimeout(function () {
        URL.revokeObjectURL(link.href);
        link.parentNode.removeChild(link);
    }, 500);
}

function pickBrowserFiles(folder) {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".js,.txt,.json,.md,.cfg";
    input.multiple = true;
    if (folder) {
        input.setAttribute("webkitdirectory", "");
    }
    input.onchange = function () {
        var list = Array.prototype.slice.call(input.files || []);
        if (folder) {
            list = list.filter(function (f) {
                return /\.(js|txt|json|md|cfg)$/i.test(f.name);
            });
        }
        readBrowserFiles(list, function (entries) {
            if (folder) {
                var root = entries.length ? (entries[0].path.split("/")[0] || "folder") : "folder";
                app.browserFolder = {};
                entries.forEach(function (e) {
                    app.browserFolder[e.path] = e.text;
                });
                app.folder = { name: root, path: "browser:" + root, files: entries.map(function (e) {
                    return { name: e.path.split("/").slice(1).join("/") || e.name, path: e.path };
                }) };
                showView("explorer");
                renderExplorer();
                persist();
            } else {
                entries.forEach(function (e) {
                    openDiskFile("browser:" + e.name, e.name, e.text, "browser");
                });
            }
        });
    };
    input.click();
}

function readBrowserFiles(list, done) {
    var results = [];
    var pending = list.length;
    if (!pending) {
        done(results);
        return;
    }
    list.forEach(function (file, index) {
        var reader = new FileReader();
        reader.onload = function () {
            results[index] = { name: file.name, path: file.webkitRelativePath || file.name, text: String(reader.result).replace(/\r\n?/g, "\n") };
            pending--;
            if (!pending) {
                done(results);
            }
        };
        reader.readAsText(file);
    });
}

function openFileCommand() {
    if (!callEngine("editorOpenFile")) {
        pickBrowserFiles(false);
    }
}

function openFolderCommand() {
    if (!callEngine("editorOpenFolder")) {
        pickBrowserFiles(true);
    }
}

function openFolderEntry(path) {
    var existing = findFileByPath(path);
    if (existing) {
        openTab(existing.id);
        return;
    }
    if (path.indexOf("browser:") !== 0 && inPacketTracer) {
        callEngine("editorReadFile", path);
        return;
    }
    var text = app.browserFolder[path];
    if (text === undefined) {
        notify("warning", "Open the folder again to read this file");
        return;
    }
    openDiskFile(path, path.split("/").pop(), text, "browser");
}

function refreshFolder() {
    if (app.folder && inPacketTracer && app.folder.path.indexOf("browser:") !== 0) {
        callEngine("editorListFolder", app.folder.path);
    }
}

function renameFile(id) {
    var file = app.files[id];
    if (!file || file.source !== "workspace") {
        return;
    }
    showDialog({ title: "Rename", message: "New name for " + file.name, input: file.name, buttons: ["Rename", "Cancel"] }, function (choice, value) {
        var name = String(value || "").trim();
        if (choice !== 0 || !name || name === file.name) {
            return;
        }
        file.name = uniqueName(/\.[A-Za-z0-9]+$/.test(name) ? name : name + ".js");
        renderTabs();
        renderExplorer();
        renderBreadcrumbs();
        persist();
    });
}

function deleteFile(id) {
    var file = app.files[id];
    if (!file) {
        return;
    }
    showDialog({ title: "Delete " + file.name + "?", message: "The file is removed from the PTForge workspace. This cannot be undone.", buttons: ["Delete", "Cancel"], danger: true }, function (choice) {
        if (choice !== 0) {
            return;
        }
        file.source = "gone";
        closeTab(id, true);
        if (app.files[id]) {
            delete app.files[id];
            app.order.splice(app.order.indexOf(id), 1);
        }
        renderExplorer();
        persist();
    });
}

function renderFunctions() {
    var query = byId("fn-search").value.trim().toLowerCase();
    var groups = {};
    var order = [];
    functionCatalog.forEach(function (fn) {
        var hay = (fn.name + " " + fn.info + " " + fn.area).toLowerCase();
        if (query && hay.indexOf(query) === -1) {
            return;
        }
        if (!groups[fn.area]) {
            groups[fn.area] = [];
            order.push(fn.area);
        }
        groups[fn.area].push(fn);
    });
    var total = 0;
    byId("fn-list").innerHTML = order.map(function (area) {
        total += groups[area].length;
        return "<div class=\"section-head" + (query ? "" : " collapsed") + "\" data-section=\"fn-" + escapeHtml(area) + "\">" + icon("chevron", "twisty") + "<span class=\"sec-title\">" + escapeHtml(area) +
            "</span><span class=\"count\">" + groups[area].length + "</span></div><div class=\"section-body\">" + groups[area].map(function (fn) {
                return "<div class=\"fn-row\" data-insert=\"" + fn.name + "\" title=\"" + escapeHtml(fn.info) + "\"><div class=\"fn-sig\"><span class=\"tk-api\">" + fn.name + "</span><span class=\"fn-args\">(" + escapeHtml(fn.args) + ")</span></div><div class=\"fn-info\">" + escapeHtml(fn.info) + "</div></div>";
            }).join("") + "</div>";

function deviceIcon(type) {
    if (/router/.test(type) && !/wireless/.test(type)) {
        return icon("router", "dev-router");
    }
    if (/switch|hub|bridge/.test(type)) {
        return icon("switch", "dev-switch");
    }
    if (/server/.test(type)) {
        return icon("server", "dev-server");
    }
    if (/cloud|remote|modem/.test(type)) {
        return icon("cloud", "dev-cloud");
    }
    if (/wireless|accesspoint/.test(type)) {
        return icon("wireless", "dev-wireless");
    }
    return icon("pc", "dev-pc");
}

function renderChecks() {
    var body = byId("panel-checks");

        body.innerHTML = "<div class=\"empty\">Run <code>endChecks()</code> or <code>auditNetwork()</code> to see a report here. <a data-cmd=\"snippet.labcheck\">Insert a Lab Check template</a></div>";

    }
    body.innerHTML = app.reports.map(function (r) {
        if (r.kind === "report") {
            var d = r.data;
            var grade = d.percent >= 90 ? "good" : d.percent >= 60 ? "ok" : "bad";
            return "<div class=\"report\"><div class=\"report-head\"><div class=\"score " + grade + "\" style=\"--p:" + d.percent + "\"><span>" + d.percent + "%</span></div><div><div class=\"report-title\">" + escapeHtml(d.title) +
                "</div><div class=\"report-sub\">" + d.passed + " of " + d.total + " checks passed, score " + d.score + "/" + d.maxScore + " at " + r.time + "</div></div></div>" +
                d.items.map(function (item) {

                        "</span><span class=\"check-pts\">" + (item.passed ? item.points : 0) + "/" + item.points + "</span>" + (item.hint ? "<div class=\"check-hint\">" + escapeHtml(item.hint) + "</div>" : "") + "</div>";

            "</span><span class=\"b-info\">" + icon("info") + a.infos + "</span></div><div><div class=\"report-title\">Network audit</div><div class=\"report-sub\">" + a.findings.length + " findings at " + r.time + "</div></div></div>" +

            }).join("") : "<div class=\"check-row pass\">" + icon("checks") + "<span class=\"check-name\">No issues found</span></div>") + "</div>";
