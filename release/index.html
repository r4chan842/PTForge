<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTForge</title>

    <style>
:root {
    --bg: #1f1f1f;
    --fg: #cccccc;
    --muted: #9d9d9d;
    --side: #181818;
    --activity: #181818;
    --title: #181818;
    --tabs: #181818;
    --tab: #181818;
    --panel: #181818;
    --border: #2b2b2b;
    --hover: #2a2d2e;
    --select: #37373d;
    --focus: #0078d4;
    --accent: #0078d4;
    --accent-hover: #026ec1;
    --input: #313131;
    --input-border: #3c3c3c;
    --widget: #202020;
    --widget-border: #313131;
    --menu-border: #454545;
    --list-active: #04395e;
    --line-number: #6e7681;
    --error: #f85149;
    --warning: #cca700;
    --info: #3794ff;
    --ok: #2ea043;
    --link: #4daafc;
    --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
    --ui: -apple-system, "Segoe UI", system-ui, Ubuntu, "Helvetica Neue", sans-serif;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 13px var(--ui);
    overflow: hidden;
    user-select: none;
}

.hidden {
    display: none !important;
}

input,
textarea,
select,
button {
    color: inherit;
    font: inherit;
}

a {
    color: var(--link);
}

.ico {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex: none;
}

.app {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.titlebar {
    height: 35px;
    background: var(--title);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    flex: none;
    position: relative;
    z-index: 20;
}

.brand {
    width: 48px;
    display: flex;
    justify-content: center;
}

.logo {
    width: 18px;
    height: 18px;
}

.menubar {
    display: flex;
    height: 100%;
}

.menu {
    position: relative;
    height: 100%;
}

.menu-title {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 8px;
    color: #cccccc;
    cursor: default;
    border-radius: 4px;
}

.menu:hover .menu-title,
.menu.open .menu-title {
    background: rgba(255, 255, 255, .1);
}

.menu-drop {
    display: none;
    position: absolute;
    top: 32px;
    left: 0;
    min-width: 270px;
    background: var(--bg);
    border: 1px solid var(--menu-border);
    border-radius: 5px;
    padding: 4px 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .6);
}

.menu.open .menu-drop {
    display: block;
}

.menu-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 22px 4px 26px;
    margin: 0 4px;
    border-radius: 3px;
    color: #cccccc;
    cursor: default;
}

.menu-item:hover {
    background: var(--accent);
    color: #fff;
}

.menu-key {
    color: var(--muted);
    margin-left: 32px;
    font-size: 12px;
}

.menu-item:hover .menu-key {
    color: #ddd;
}

.menu-sep {
    height: 1px;
    background: var(--menu-border);
    margin: 4px 0;
}

.command-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: min(28vw, 380px);
    height: 24px;
    background: #222222;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
}

.command-center:hover {
    background: #292929;
    border-color: #464646;
    color: var(--fg);
}

.title-grow {
    flex: 1;
}

.workbench {
    flex: 1;
    display: flex;
    min-height: 0;
}

.activitybar {
    width: 48px;
    background: var(--activity);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex: none;
}

.act {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #868686;
    cursor: pointer;
    position: relative;
}

.act .ico {
    width: 24px;
    height: 24px;
}

.act:hover {
    color: #d7d7d7;
}

.act.active {
    color: #d7d7d7;
}

.act.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--accent);
}

.act-grow {
    flex: 1;
}

.sidebar {
    background: var(--side);
    border-right: 1px solid var(--border);
    flex: none;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
}

.view {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
}

.view-head {
    height: 35px;
    padding: 0 8px 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--fg);
    flex: none;
}

.view-acts,
.sec-acts {
    display: flex;
    gap: 2px;
}

.sec-act {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: #c5c5c5;
    cursor: pointer;
}

.sec-act:hover {
    background: rgba(90, 93, 94, .31);
}

.view-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
}

.section-head {
    height: 22px;
    display: flex;
    align-items: center;
    padding-right: 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: #cccccc;
    cursor: pointer;
    border-top: 1px solid rgba(204, 204, 204, .12);
}

.section-head .sec-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.section-head .sec-acts {
    visibility: hidden;
}

.section-head:hover .sec-acts,
.view:hover .section-head .sec-acts {
    visibility: visible;
}

.twisty {
    margin: 0 2px 0 2px;
    transform: rotate(90deg);
    transition: transform .1s;
}

.section-head.collapsed .twisty {
    transform: rotate(0deg);
}

.section-head.collapsed + .section-body {
    display: none;
}

.section-body {
    padding: 2px 0 6px;
}

.tree-row {
    height: 22px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 22px;
    cursor: pointer;
    color: #cccccc;
    position: relative;
}

.tree-row:hover {
    background: var(--hover);
}

.tree-row.selected {
    background: var(--select);
}

.row-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.row-close {
    position: absolute;
    left: 4px;
    visibility: hidden;
    display: flex;
}

.tree-row:hover .row-close {
    visibility: visible;
}

.row-acts {
    display: none;
    gap: 2px;
}

.row-acts span {
    display: flex;
    padding: 2px;
    border-radius: 3px;
}

.row-acts span:hover {
    background: rgba(90, 93, 94, .5);
}

.tree-row:hover .row-acts {
    display: flex;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c5c5c5;
    flex: none;
}

.tree-empty,
.tree-hint {
    padding: 6px 22px;
    color: var(--muted);
    line-height: 1.5;
}

.tree-empty a {
    color: #3794ff;
    cursor: pointer;
}

.file-js {
    width: 16px;
}

.file-txt {
    color: #9da5b4;
}

.btn {
    background: #313131;
    color: var(--fg);
    border: 1px solid rgba(255, 255, 255, .03);
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 4px 12px;
    font: 13px var(--ui);
    cursor: pointer;
}

.btn:hover {
    background: #3c3c3c;
}

.btn[disabled] {
    opacity: .5;
    cursor: default;
}

.btn.primary {
    background: var(--accent);
    color: #fff;
}

.btn.primary:hover {
    background: var(--accent-hover);
}

.btn.danger {
    background: #c72e24;
    color: #fff;
}

.btn.block {
    display: flex;
    width: calc(100% - 40px);
    margin: 8px 20px 0;
    padding: 5px;
}

.btn.small {
    padding: 2px 8px;
    font-size: 12px;
}

.btn:focus {
    outline: 1px solid var(--focus);
    outline-offset: 1px;
}

.search-box {
    padding: 4px 12px 8px 20px;
}

.search-box input,
.tool input {
    width: 100%;
    height: 26px;
    background: var(--input);
    border: 1px solid var(--input-border);
    border-radius: 2px;
    color: var(--fg);
    padding: 0 6px;
    font: 13px var(--ui);
    outline: none;
}

.search-box input:focus,
.tool input:focus {
    border-color: var(--focus);
}

.count-note {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.section-head .count,
.problem-file .count {
    background: #616161;
    color: #fff;
    border-radius: 11px;
    padding: 0 6px;
    font-size: 11px;
    font-weight: 400;
    line-height: 16px;
}

.fn-row {
    padding: 4px 12px 4px 22px;
    cursor: pointer;
}

.fn-row:hover {
    background: var(--hover);
}

.fn-sig {
    font: 12.5px var(--mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.fn-args {
    color: #9cdcfe;
}

.fn-info {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.snip {
    margin: 0 12px 8px 20px;
    padding: 8px 10px;
    background: #2b2b2c;
    border: 1px solid #333;
    border-radius: 4px;
}

.snip-name {
    display: flex;
    gap: 6px;
    align-items: center;
    font-weight: 600;
    color: #e0e0e0;
}

.snip-name .ico {
    color: #b180d7;
}

.snip-info {
    color: var(--muted);
    font-size: 12px;
    margin: 3px 0 7px;
}

.snip-acts {
    display: flex;
    gap: 6px;
}

.dev-head .ico:not(.twisty) {
    margin-right: 6px;
}

.dev-head {
    text-transform: none;
    font-weight: 400;
    font-size: 13px;
    border-top: 0;
    height: 24px;
}

.dev-head:hover {
    background: var(--hover);
}

.dev-name:hover {
    text-decoration: underline;
}

.dev-model {
    color: var(--muted);
    font-size: 11px;
}

.dev-router {
    color: #4fc1ff;
}

.dev-switch {
    color: #4ec9b0;
}

.dev-server {
    color: #c586c0;
}

.dev-pc {
    color: #dcdcaa;
}

.dev-cloud,
.dev-wireless {
    color: #ce9178;
}

.port-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 1px 12px 1px 44px;
    font: 12px var(--mono);
    cursor: pointer;
}

.port-row:hover {
    background: var(--hover);
}

.port-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.port-ip {
    color: #b5cea8;
}

.led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
}

.led.up {
    background: #3fb950;
    box-shadow: 0 0 4px #3fb950;
}

.led.down {
    background: #f85149;
}

.dev-actions {
    padding: 8px 0 16px;
    border-top: 1px solid rgba(204, 204, 204, .12);
}

.tool {
    padding: 8px 12px 12px 20px;
    border-bottom: 1px solid rgba(204, 204, 204, .12);
}

.tool-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: #bbb;
}

.tool input + input {
    margin-top: 4px;
}

table.calc {
    width: 100%;
    border-collapse: collapse;
    margin: 6px 0;
    font-size: 12px;
}

table.calc th {
    text-align: left;
    color: var(--muted);
    font-weight: 400;
    padding: 2px 8px 2px 0;
    white-space: nowrap;
    vertical-align: top;
}

table.calc td {
    font-family: var(--mono);
    color: #b5cea8;
    padding: 2px 0;
    word-break: break-all;
}

table.calc.grid th {
    border-bottom: 1px solid #3c3c3c;
}

table.calc.grid td {
    padding-right: 6px;
    color: #d4d4d4;
}

table.calc td.small {
    font-size: 11px;
    color: var(--muted);
}

.copyable {
    cursor: copy;
}

.copyable:hover {
    text-decoration: underline dotted;
}

.calc-error {
    color: var(--error);
    font-size: 12px;
    margin-top: 6px;
}

.sash {
    flex: none;
    position: relative;
    z-index: 5;
}

.sash-x {
    width: 4px;
    margin: 0 -2px;
    cursor: ew-resize;
}

.sash-y {
    height: 4px;
    margin: -2px 0;
    cursor: ns-resize;
}

.sash:hover,
body.dragging-x .sash-x,
body.dragging-y .sash-y {
    background: var(--focus);
    transition: background .1s .3s;
}

body.dragging-x,
body.dragging-y {
    cursor: grabbing;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.editor-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg);
}

.tabs-row {
    height: 35px;
    background: var(--tabs);
    box-shadow: inset 0 -1px 0 var(--border);
    display: flex;
    flex: none;
}

.tabs {
    flex: 1;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
}

.tabs::-webkit-scrollbar {
    height: 3px;
}

.tabs::-webkit-scrollbar-thumb {
    background: rgba(121, 121, 121, .4);
}

.tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px 0 10px;
    min-width: fit-content;
    background: var(--tab);
    color: var(--muted);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    position: relative;
}

.tab.active {
    background: var(--bg);
    color: #fff;
    border-bottom-color: var(--bg);
}

.tab.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background: var(--focus);
}

.tab-name {
    white-space: nowrap;
}

.tab-close {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    visibility: hidden;
}

.tab.active .tab-close,
.tab:hover .tab-close {
    visibility: visible;
}

.tab-close:hover {
    background: rgba(90, 93, 94, .5);
}

.tab.dirty .tab-close .ico {
    display: none;
}

.tab.dirty .tab-close {
    visibility: visible;
}

.tab.dirty .tab-close::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
}

.tab.dirty .tab-close:hover::before {
    display: none;
}

.tab.dirty .tab-close:hover .ico {
    display: block;
}

.editor-actions {
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 2px;
}

.ea,
.pa {
    width: 26px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: #c5c5c5;
    cursor: pointer;
}

.ea:hover,
.pa:hover {
    background: rgba(90, 93, 94, .31);
}

.run-ico {
    color: #89d185;
}

.editor-title {
    height: 22px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    flex: none;
}

.breadcrumbs {
    display: flex;
    align-items: center;
    gap: 3px;
    color: #a9a9a9;
    font-size: 13px;
}

.crumb-sep {
    width: 14px;
    opacity: .8;
}

.editors {
    flex: 1;
    position: relative;
    min-height: 0;
}

.ed {
    position: absolute;
    inset: 0;
    display: flex;
    --ed-font: 14px;
    --ed-line: 21px;
    --ed-gutter: 6ch;
    font-family: var(--mono);
    font-size: var(--ed-font);
}

.ed-gutter {
    width: calc(var(--ed-gutter) + 38px);
    flex: none;
    overflow: hidden;
    background: var(--bg);
    position: relative;
    cursor: default;
}

.ed-lines {
    will-change: transform;
}

.ed-ln {
    height: var(--ed-line);
    line-height: var(--ed-line);
    display: flex;
    padding-right: 20px;
    color: var(--line-number);
    position: relative;
}

.ed-glyph {
    width: 18px;
    flex: none;
    position: relative;
    cursor: pointer;
}

.ed-num {
    flex: 1;
    text-align: right;
}

.ed-glyph::before {
    content: "";
    position: absolute;
    left: 4px;
    top: calc(50% - 5px);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: none;
}

.ed-ln:hover .ed-glyph::before {
    display: block;
    background: rgba(229, 20, 0, .45);
}

.ed-ln.bp .ed-glyph::before {
    display: block;
    background: #e51400;
}

.ed-ln.bp-cond .ed-glyph::before {
    background: #e51400;
    box-shadow: inset 0 0 0 3px #e51400, inset 0 0 0 5px #1f1f1f;
}

.ed-ln.bp-log .ed-glyph::before {
    border-radius: 1px;
    transform: rotate(45deg) scale(.85);
}

.ed-ln.bp-off .ed-glyph::before {
    background: #848484;
    box-shadow: none;
}

.ed-ln.bp-unverified .ed-glyph::before {
    background: transparent;
    box-shadow: inset 0 0 0 1.5px #848484;
}

.ed-ln.exec .ed-glyph::after,
.ed-ln.exec-frame .ed-glyph::after {
    content: "";
    position: absolute;
    left: 3px;
    top: calc(50% - 6px);
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 12px solid #ffcc00;
}

.ed-ln.exec-frame .ed-glyph::after {
    border-left-color: #89d185;
}

.ed-exec {
    position: absolute;
    left: 0;
    right: 0;
    height: var(--ed-line);
    background: rgba(255, 255, 0, .2);
    border: 1px solid rgba(255, 204, 0, .35);
    pointer-events: none;
}

.ed-exec.focus {
    background: rgba(122, 189, 122, .3);
    border-color: transparent;
}

.ed-zone {
    position: absolute;
    left: 0;
    right: 12px;
    z-index: 4;
    background: #1f1f1f;
    border-top: 2px solid var(--error);
    border-bottom: 2px solid var(--error);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .5);
    font: 13px var(--ui);
    padding: 6px 14px 8px;
    pointer-events: none;
}

.ed-zone-head {
    color: var(--error);
    font-weight: 600;
    margin-bottom: 4px;
}

.ed-zone-body {
    color: var(--fg);
    font-family: var(--mono);
    white-space: pre-wrap;
}

.ed-ln.active {
    color: #cccccc;
}

.ed-ln-error::after,
.ed-ln-warning::after {
    content: "";
    position: absolute;
    right: 6px;
    top: calc(50% - 4px);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--error);
}

.ed-ln-warning::after {
    background: var(--warning);
}

.ed-scroll {
    flex: 1;
    overflow: auto;
    position: relative;
}

.ed-scroll::-webkit-scrollbar,
.view-body::-webkit-scrollbar,
.panel-body::-webkit-scrollbar,
.palette-list::-webkit-scrollbar,
.ed-suggest-list::-webkit-scrollbar {
    width: 14px;
    height: 14px;
}

.ed-scroll::-webkit-scrollbar-thumb,
.view-body::-webkit-scrollbar-thumb,
.panel-body::-webkit-scrollbar-thumb,
.palette-list::-webkit-scrollbar-thumb,
.ed-suggest-list::-webkit-scrollbar-thumb {
    background: rgba(121, 121, 121, .4);
}

.ed-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(100, 100, 100, .7);
}

.ed-scroll::-webkit-scrollbar-corner {
    background: var(--bg);
}

.ed-inner {
    position: relative;
    min-width: 100%;
    min-height: 100%;
}

.ed-layer,
.ed-input,
.ed-probe {
    font-family: var(--mono);
    font-size: var(--ed-font);
    line-height: var(--ed-line);
    tab-size: 4;
    letter-spacing: 0;
    font-variant-ligatures: none;
    white-space: pre;
    word-wrap: normal;
}

.ed-layer {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 0 0 0 4px;
    pointer-events: none;
    overflow: hidden;
    color: #d4d4d4;
}

.ed-find {
    color: transparent;
}

.ed-find mark {
    background: rgba(234, 92, 0, .33);
    color: transparent;
    border-radius: 2px;
}

.ed-find mark.current {
    background: #515c6a;
    outline: 1px solid #f4b400;
}

.ed-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0 0 0 4px;
    border: 0;
    outline: none;
    resize: none;
    overflow: hidden;
    background: transparent;
    color: transparent;
    caret-color: #aeafad;
    user-select: text;
    z-index: 2;
}

.ed-input::selection {
    background: rgba(38, 79, 120, .95);
    color: transparent;
}

.ed-probe {
    position: absolute;
    visibility: hidden;
    top: -100px;
}

.ed-current {
    position: absolute;
    left: 0;
    right: 0;
    height: var(--ed-line);
    border-top: 1px solid #282828;
    border-bottom: 1px solid #282828;
    pointer-events: none;
}

.ed:focus-within .ed-current {
    border-color: #2f2f2f;
    background: rgba(255, 255, 255, .02);
}

.tk-comment {
    color: #6a9955;
}

.tk-string {
    color: #ce9178;
}

.tk-regex {
    color: #d16969;
}

.tk-number {
    color: #b5cea8;
}

.tk-keyword {
    color: #569cd6;
}

.tk-control {
    color: #c586c0;
}

.tk-constant {
    color: #569cd6;
}

.tk-type {
    color: #4ec9b0;
}

.tk-function,
.tk-method,
.tk-builtin {
    color: #dcdcaa;
}

.tk-builtin:not(.tk-function) {
    color: #4ec9b0;
}

.tk-api {
    color: #4fc1ff;
    font-weight: 600;
}

.tk-variable,
.tk-property {
    color: #9cdcfe;
}

.tk-operator,
.tk-punctuation {
    color: #d4d4d4;
}

.tk-b1 {
    color: #ffd700;
}

.tk-b2 {
    color: #da70d6;
}

.tk-b3 {
    color: #179fff;
}

.tk-match {
    outline: 1px solid #888;
    background: rgba(0, 100, 0, .25);
}

.tk-warn {
    text-decoration: underline wavy var(--warning);
    text-decoration-skip-ink: none;
    text-underline-offset: 3px;
}

.tk-err {
    text-decoration: underline wavy var(--error);
    text-decoration-skip-ink: none;
    text-underline-offset: 3px;
}

.ed-suggest {

    display: flex;
    align-items: flex-start;

}

.ed-suggest-list {

.ed-suggest-row {

    align-items: center;

    padding: 0 8px 0 6px;

}

}

.ed-suggest-row.selected {

}

.ed-suggest-row.selected b {

}

.sg-label {

    text-overflow: ellipsis;
}

.sg-area {

.sg-icon {

}

.sg-api::before {

}

.sg-keyword::before {

}

.ed-suggest-doc {

}

.ed-suggest-doc code {

}

.ed-suggest-doc p {

}

.ed-hint {

}

.hint-sig {

}

.hint-sig b {
    color: #fff;
    text-decoration: underline;
    font-weight: 700;
}

.hint-info {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}

.find {

    right: 26px;

    border-radius: 0 0 4px 4px;
    border-left: 3px solid transparent;
}

.find-toggle {

}

}

}

.find-rows {

}

.find-row {

}

.replace-row {

}

}

.find-field {

}

.find-field input {

    padding: 0 4px;

}

}

.opt {

    margin-right: 2px;

    align-items: center;
    justify-content: center;

    border: 1px solid transparent;
    border-radius: 3px;

}

.opt:hover {

}

.opt.on {

    color: #fff;
}

.find-count {

    font-size: 12px;

}

.fbtn {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    cursor: pointer;
    color: #c5c5c5;
}

.fbtn:hover {
    background: rgba(90, 93, 94, .31);
}

.welcome {

    inset: 0;
    overflow: auto;

}

.welcome-inner {

}

.wl-logo svg {

}

kbd {

}

.report-title {

.report-sub {

.check-row {

.check-row:hover {

.check-row.pass .ico {

.check-row.fail {

.b-info .ico {

.dv-name.index {

.dv-sep {

.dv-value {

.dv-number {

}

.dv-boolean {

.cs-thread {

.cs-state {

.cs-frame {

.cs-frame:hover {

}

.cs-frame.selected {

}

.cs-name {
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.cs-loc {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
}

.bp-row {

    align-items: center;
    gap: 6px;
    padding: 0 10px 0 20px;
    cursor: pointer;
}

.bp-row:hover {

}

.bp-row input {

}

.bp-dot {

.bp-dot.log {

}

.bp-dot.off {
    background: #848484;

}

.bp-dot.unverified {

}

.bp-file {
    color: var(--fg);
}

.bp-detail {

    color: var(--muted);

    white-space: nowrap;
    font-size: 12px;
}

.bp-line {

    background: rgba(255, 255, 255, .08);

}

.bp-remove {

}

.bp-row:hover .bp-remove {

}

.bp-exc span {

}

.bp-widget {

}

.bp-widget select,
.bp-widget input {

    border-radius: 2px;
    color: var(--fg);
    outline: none;
}

.bp-widget input {
    flex: 1;
    padding: 0 6px;
    font-family: var(--mono);
}

.bp-widget input:focus,
.bp-widget select:focus {
    border-color: var(--focus);
}

.ctx-menu {

    z-index: 60;
    min-width: 220px;
    background: var(--bg);

    box-shadow: 0 2px 8px rgba(0, 0, 0, .6);
}

.ctx-menu .menu-item.disabled {
    opacity: .45;
}

.debug-toolbar {

    align-items: center;
    gap: 2px;
    height: 28px;
    padding: 0 4px 0 0;
    background: #181818;
    border: 1px solid var(--border);
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .6);
}

.editor-group {
    position: relative;
}

.dt-grip {
    width: 12px;
    height: 100%;
    cursor: grab;
    background-image: radial-gradient(circle, #6e6e6e 1px, transparent 1.2px);
    background-size: 4px 4px;
    background-position: 3px 6px;
    background-repeat: repeat-y;
    margin-left: 3px;
}

.dt-btn {

    height: 24px;
    display: flex;

    justify-content: center;

}

.dt-btn:hover {

}

.dt-btn.disabled {
    opacity: .4;
    pointer-events: none;
}

.dt-continue .ico,
.dt-step .ico {
    color: #75beff;
}

.dt-restart .ico {
    color: #89d185;
}

.dt-stop .ico {
    color: #f48771;
}

.sb-debug {
    font-weight: 600;
}

.panel-debug {

    padding: 0;
}

.panel-debug.hidden {

}

.dc-out {

}

.dc-row {

    white-space: pre-wrap;
    word-break: break-word;
}

.dc-row .dc-text {

}

.dc-src {

    white-space: nowrap;
    text-decoration: none;
}

.dc-src:hover {
    color: var(--link);
    text-decoration: underline;
}

.dc-info {
    color: #3794ff;
}

.dc-log {
    color: var(--fg);
}

.dc-warning {
    color: #cca700;
}

.dc-error {
    color: #f48771;
    background: rgba(248, 81, 73, .06);
}

.dc-input {
    color: var(--muted);
}

.dc-input::before {

}

.dc-value {

    padding-left: 12px;
}

.dc-value .dv-row {
    font-size: 13px;
}

.dc-input-row {

    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 20px;

}

.dc-prompt {
    color: #3794ff;
    font: 16px var(--mono);
}

.dc-input-row input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--fg);
    font: 13px var(--mono);
}

.debug-hover {

    z-index: 50;

    border: 1px solid #454545;
    border-radius: 3px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .6);

    font: 13px var(--mono);
}

.panel-terminal {

    padding: 0;
    overflow: hidden;
}

.panel-terminal.hidden {
    display: none;
}

.term-views {

    min-width: 0;
    position: relative;
}

.term {

    inset: 0;
}

.term-scroll {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 4px 20px 8px;

    font-size: 14px;
    line-height: 1.35;

}

.term-row {
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 1.35em;
}

.term-line {
    display: flex;
    align-items: flex-start;
}

.term-prompt {
    white-space: pre;
    flex: none;
}

.term-input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    resize: none;
    padding: 0;
    margin: 0;
    color: #cccccc;

    line-height: inherit;
    overflow: hidden;
    min-height: 1.35em;

}

.term-busy {

}

.term-busy .spin,
.term-tab .spin {

}

.term-echo {
    color: #cccccc;
}

.t-bold {
    font-weight: 700;
}

.t-dim {
    color: #9d9d9d;
}

.t-red {
    color: #f14c4c;
}

.t-green {
    color: #23d18b;
}

.t-yellow {
    color: #e5e510;
}

.t-byellow {
    color: #f5f543;
}

.t-blue {
    color: #2472c8;
}

.t-bblue {
    color: #3b8eea;
}

.t-cyan {
    color: #29b8db;
}

.t-bcyan {
    color: #29b8db;
    font-weight: 700;
}

.t-bgreen {
    color: #23d18b;
    font-weight: 700;
}

.t-bwhite {
    color: #e5e5e5;
}

.term-tabs {

    padding: 2px 0;

.term-tab {

    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px 0 10px;
    cursor: pointer;

}

.term-tab:hover {
    background: var(--hover);
}

.term-tab.active {
    background: var(--select);
}

.term-tab-icon {
    font: 700 9px var(--mono);
    width: 18px;
    text-align: center;
    color: #cbcb41;
}

.term-tab-icon.cli {

}

.term-tab-name {

    white-space: nowrap;
}

    text-align: center;

.term-tab:hover .term-tab-kill {

}

.file-view {

}

.vt-note {

    gap: 8px;

}

.vt-note.ok {

}

.vt-error {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #f48771;
    background: rgba(248, 81, 73, .08);

    border-radius: 3px;

.calc-nav {

}

.calc-nav-item {

.calc-nav-item:hover {

.calc-nav-item.active {

.calc-inner {

.vt-field.wide {

}

.vt-label {

.vt-hint {

.vt-input {

    background: var(--input);

.vt-input:focus {

.vt-area {

.vt-select {

.vt-select.mini {

.bits {

.bit.host {

.bit-dot {

.bits-legend {

        parent.appendChild(node);
    }
    return node;
}

function CodeEditor(host, options) {
    this.options = options || {};
    this.api = namesToSet(this.options.catalog || []);
    this.catalog = this.options.catalog || [];
    this.catalogByName = {};
    for (var i = 0; i < this.catalog.length; i++) {
        this.catalogByName[this.catalog[i].name] = this.catalog[i];
    }
    this.problems = [];
    this.marks = {};
    this.matches = [];
    this.matchIndex = -1;
    this.lineCount = 0;
    this.suggestions = [];
    this.suggestIndex = 0;
    this.bracketMarks = {};
    this.breakpoints = {};
    this.execLine = 0;
    this.execKind = "";
    this.build(host);
    this.setFontSize(this.options.fontSize || 14);
    this.bind();
}

CodeEditor.prototype.build = function (host) {
    this.root = el("div", "ed", host);
    this.gutter = el("div", "ed-gutter", this.root);
    this.lines = el("div", "ed-lines", this.gutter);
    this.scroller = el("div", "ed-scroll", this.root);
    this.inner = el("div", "ed-inner", this.scroller);
    this.current = el("div", "ed-current", this.inner);
    this.execBar = el("div", "ed-exec hidden", this.inner);
    this.findLayer = el("pre", "ed-layer ed-find", this.inner);
    this.hl = el("pre", "ed-layer ed-hl", this.inner);
    this.input = el("textarea", "ed-input", this.inner);
    this.input.setAttribute("spellcheck", "false");
    this.input.setAttribute("wrap", "off");
    this.input.setAttribute("autocomplete", "off");
    this.input.setAttribute("autocapitalize", "off");
    this.probe = el("span", "ed-probe", this.inner);
    this.probe.textContent = new Array(101).join("M");
    this.suggestBox = el("div", "ed-suggest hidden", this.root);
    this.suggestList = el("div", "ed-suggest-list", this.suggestBox);
    this.suggestDoc = el("div", "ed-suggest-doc", this.suggestBox);
    this.hint = el("div", "ed-hint hidden", this.root);
    this.zone = el("div", "ed-zone hidden", this.inner);
};

CodeEditor.prototype.bind = function () {
    var self = this;
    this.input.addEventListener("input", function (event) {
        self.onInput(event);
    });
    this.input.addEventListener("keydown", function (event) {
        self.onKeyDown(event);
    });
    ["keyup", "click", "select", "focus"].forEach(function (name) {
        self.input.addEventListener(name, function () {
            self.scheduleCursor();
        });
    });
    this.input.addEventListener("blur", function () {
        setTimeout(function () {
            if (document.activeElement !== self.input) {
                self.closeSuggest();
                self.hint.classList.add("hidden");
            }
        }, 150);
    });
    this.scroller.addEventListener("scroll", function () {
        self.lines.style.transform = "translateY(" + (-self.scroller.scrollTop) + "px)";
        self.closeSuggest();
        self.hint.classList.add("hidden");
    });
    this.suggestList.addEventListener("mousedown", function (event) {
        var row = event.target.closest(".ed-suggest-row");
        if (row) {
            event.preventDefault();
            self.suggestIndex = Number(row.getAttribute("data-index"));
            self.acceptSuggestion();
        }
    });
    this.gutter.addEventListener("mousedown", function (event) {
        var row = event.target.closest(".ed-ln");
        if (!row || event.button !== 0) {
            return;
        }
        event.preventDefault();
        var line = Number(row.getAttribute("data-line"));
        if (event.target.closest(".ed-glyph") && self.options.onGlyphClick) {
            self.options.onGlyphClick(line, event);
        } else {
            self.selectLine(line);
        }
    });
    this.gutter.addEventListener("contextmenu", function (event) {
        var row = event.target.closest(".ed-ln");
        if (row && self.options.onGutterMenu) {
            event.preventDefault();
            self.options.onGutterMenu(Number(row.getAttribute("data-line")), event);
        }
    });
    this.input.addEventListener("beforeinput", function () {
        self.rememberLines();
    });
    this.input.addEventListener("mousemove", function (event) {
        self.onHoverMove(event);
    });
    this.input.addEventListener("mouseleave", function () {
        clearTimeout(self.hoverTimer);
        if (self.options.onHover) {
            self.options.onHover(null);
        }
    });
};

CodeEditor.prototype.rememberLines = function () {
    var sel = this.selection();
    var text = this.input.value;
    var startLine = text.substring(0, sel.start).split("\n").length;
    var endLine = text.substring(0, sel.end).split("\n").length;
    var lineStart = text.lastIndexOf("\n", sel.start - 1) + 1;
    this.before = { count: text.split("\n").length, start: startLine, end: endLine, atLineStart: sel.start === lineStart && sel.start === sel.end };
};

CodeEditor.prototype.trackLines = function () {
    var before = this.before;
    this.before = null;
    if (!before) {
        return;
    }
    var delta = this.input.value.split("\n").length - before.count;
    if (!delta || !this.options.onLinesShift) {
        return;
    }
    this.options.onLinesShift({ start: before.start, end: before.end, delta: delta, atLineStart: before.atLineStart });
};

CodeEditor.prototype.positionAt = function (clientX, clientY) {
    var box = this.scroller.getBoundingClientRect();
    var y = clientY - box.top + this.scroller.scrollTop;
    var x = clientX - box.left + this.scroller.scrollLeft - 8;
    var lines = this.input.value.split("\n");
    var line = Math.floor(y / this.lineHeight) + 1;
    if (line < 1 || line > lines.length || x < 0) {
        return null;
    }
    var column = Math.floor(x / this.measure());
    if (column >= lines[line - 1].length) {
        return null;
    }
    return { line: line, column: column + 1, offset: this.offsetOfLine(line) + column };
};

CodeEditor.prototype.expressionAt = function (offset) {
    var text = this.input.value;
    if (!/[\w$]/.test(text.charAt(offset))) {
        return null;
    }
    var start = offset;
    var end = offset;
    while (end < text.length && /[\w$]/.test(text.charAt(end))) {
        end++;
    }
    while (start > 0 && /[\w$.]/.test(text.charAt(start - 1))) {
        start--;
    }
    var expression = text.substring(start, end).replace(/^\.+/, "");
    if (!/^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$/.test(expression) || this.inStringOrComment(offset)) {
        return null;
    }
    return { expression: expression, start: start, end: end };
};

CodeEditor.prototype.onHoverMove = function (event) {
    var self = this;
    if (!this.options.onHover) {
        return;
    }
    clearTimeout(this.hoverTimer);
    var x = event.clientX;
    var y = event.clientY;
    this.hoverTimer = setTimeout(function () {
        var pos = self.positionAt(x, y);
        var found = pos ? self.expressionAt(pos.offset) : null;
        self.options.onHover(found ? { expression: found.expression, line: pos.line, x: x, y: y } : null);
    }, 350);
};

CodeEditor.prototype.setBreakpoints = function (map) {
    this.breakpoints = map || {};
    this.gutterDirty = true;
    this.renderGutter(this.input.value.split("\n").length);
};

CodeEditor.prototype.setExecution = function (line, kind, message) {
    this.execLine = line || 0;
    this.execKind = kind || "";
    this.execBar.classList.toggle("hidden", !this.execLine);
    this.execBar.classList.toggle("focus", this.execKind === "frame");
    if (this.execLine) {
        this.execBar.style.top = (this.execLine - 1) * this.lineHeight + "px";
    }
    this.zone.classList.toggle("hidden", !(this.execLine && message));
    if (this.execLine && message) {
        this.zone.style.top = this.execLine * this.lineHeight + "px";
        this.zone.innerHTML = "<div class=\"ed-zone-head\">Exception has occurred: " + escapeHtml(message.split(":")[0]) + "</div><div class=\"ed-zone-body\">" + escapeHtml(message) + "</div>";
    }
    this.gutterDirty = true;
    this.renderGutter(this.input.value.split("\n").length);
    if (this.execLine) {
        var top = (this.execLine - 1) * this.lineHeight;
        var view = this.scroller.clientHeight;
        if (top < this.scroller.scrollTop || top + this.lineHeight * 3 > this.scroller.scrollTop + view) {
            this.scroller.scrollTop = Math.max(0, top - Math.round(view / 3));
        }
    }
};

CodeEditor.prototype.setFontSize = function (size) {
    this.fontSize = size;
    this.lineHeight = Math.round(size * 1.5);
    this.root.style.setProperty("--ed-font", size + "px");
    this.root.style.setProperty("--ed-line", this.lineHeight + "px");
    this.charWidth = 0;
    this.render();
};

CodeEditor.prototype.measure = function () {
    if (!this.charWidth) {
        var width = this.probe.getBoundingClientRect().width / 100;
        this.charWidth = width > 0 ? width : this.fontSize * 0.6;
    }
    return this.charWidth;
};

CodeEditor.prototype.getValue = function () {
    return this.input.value;
};

CodeEditor.prototype.setValue = function (text) {
    this.before = null;
    this.input.value = String(text).replace(/\r\n?/g, "\n");
    this.input.setSelectionRange(0, 0);
    this.render();
    this.updateCursor();
};

CodeEditor.prototype.focus = function () {
    this.input.focus();
};

CodeEditor.prototype.show = function (visible) {
    this.root.classList.toggle("hidden", !visible);
    if (visible) {
        this.charWidth = 0;
        this.render();
        this.updateCursor();
    }
};

CodeEditor.prototype.selection = function () {
    return { start: this.input.selectionStart, end: this.input.selectionEnd };
};

CodeEditor.prototype.selectedText = function () {
    var sel = this.selection();
    return this.input.value.substring(sel.start, sel.end);
};

CodeEditor.prototype.replaceRange = function (start, end, text, selStart, selEnd) {
    var input = this.input;
    input.focus();
    input.setSelectionRange(start, end);
    this.rememberLines();
    this.programmatic = true;
    var done = false;
    try {
        done = text === "" ? (start === end || document.execCommand("delete", false)) : document.execCommand("insertText", false, text);
    } catch (error) {
        done = false;
    }
    if (!done || input.value.substring(start, start + text.length) !== text) {
        input.setSelectionRange(start, end);
        this.rememberLines();
        input.setRangeText(text, start, end, "end");
        this.onInput({ inputType: "insertReplacementText" });
    }
    this.before = null;
    this.programmatic = false;
    var caretStart = selStart === undefined ? start + text.length : selStart;
    input.setSelectionRange(caretStart, selEnd === undefined ? caretStart : selEnd);
    this.scheduleCursor();
};

CodeEditor.prototype.insert = function (text) {
    var sel = this.selection();
    this.replaceRange(sel.start, sel.end, text);
};

CodeEditor.prototype.onInput = function (event) {
    this.trackLines();
    this.render();
    this.updateCursor();
    if (this.options.onChange) {
        this.options.onChange(this);
    }
    var type = event && event.inputType;
    if (this.programmatic) {
        this.closeSuggest();
    } else if (type === "insertText" && event.data && event.data.length === 1 && /[\w$]/.test(event.data)) {
        this.openSuggest(false);
    } else if (type === "deleteContentBackward" && !this.suggestBox.classList.contains("hidden")) {
        this.openSuggest(false);
    } else {
        this.closeSuggest();
    }
};

CodeEditor.prototype.render = function () {
    var text = this.input.value;
    var marks = {};
    var key;
    for (key in this.marks) {
        marks[key] = this.marks[key];
    }
    for (key in this.bracketMarks) {
        marks[key] = marks[key] ? marks[key] + " tk-" + this.bracketMarks[key] : this.bracketMarks[key];
    }
    this.hl.innerHTML = highlightHtml(text, this.api, marks) + "\n";
    this.renderFind();
    var lines = text.split("\n");
    if (lines.length !== this.lineCount || this.gutterDirty) {
        this.renderGutter(lines.length);
    }
    var longest = 0;
    for (var i = 0; i < lines.length; i++) {
        var width = lines[i].replace(/\t/g, editorIndent).length;
        if (width > longest) {
            longest = width;
        }
    }
    var viewHeight = this.scroller.clientHeight || 400;
    var viewWidth = this.scroller.clientWidth || 600;
    this.inner.style.height = Math.max(viewHeight, lines.length * this.lineHeight + Math.round(viewHeight * 0.6)) + "px";
    this.inner.style.width = Math.max(viewWidth, Math.ceil(longest * this.measure()) + 80) + "px";
};

CodeEditor.prototype.renderGutter = function (count) {
    var byLine = {};
    this.problems.forEach(function (p) {
        if (!byLine[p.line] || p.severity === "error") {
            byLine[p.line] = p.severity;
        }
    });
    var html = [];
    for (var i = 1; i <= count; i++) {
        var css = "ed-ln" + (byLine[i] ? " ed-ln-" + byLine[i] : "") + (i === this.activeLine ? " active" : "");
        var bp = this.breakpoints[i];
        if (bp) {
            css += " bp" + (bp.enabled === false ? " bp-off" : "") + (bp.log ? " bp-log" : bp.condition || bp.hit ? " bp-cond" : "") + (bp.verified === false ? " bp-unverified" : "");
        }
        if (i === this.execLine) {
            css += this.execKind === "frame" ? " exec-frame" : " exec";
        }
        html.push("<div class=\"" + css + "\" data-line=\"" + i + "\"><span class=\"ed-glyph\"></span><span class=\"ed-num\">" + i + "</span></div>");
    }
    this.lines.innerHTML = html.join("");
    this.lineCount = count;
    this.gutterDirty = false;
    this.root.style.setProperty("--ed-gutter", Math.max(3, String(count).length) + 3 + "ch");
};

CodeEditor.prototype.lineColumn = function (offset) {
    var before = this.input.value.substring(0, offset);
    var line = before.split("\n").length;
    return { line: line, column: offset - before.lastIndexOf("\n") };
};

CodeEditor.prototype.offsetOfLine = function (line) {
    var text = this.input.value;
    var offset = 0;
    for (var i = 1; i < line; i++) {
        var next = text.indexOf("\n", offset);
        if (next === -1) {
            return text.length;
        }
        offset = next + 1;
    }
    return offset;
};

CodeEditor.prototype.scheduleCursor = function () {
    var self = this;
    if (this.cursorTimer) {
        return;
    }
    this.cursorTimer = setTimeout(function () {
        self.cursorTimer = null;
        self.updateCursor();
    }, 0);
};

CodeEditor.prototype.updateCursor = function () {
    var sel = this.selection();
    var pos = this.lineColumn(sel.end);
    this.current.style.top = (pos.line - 1) * this.lineHeight + "px";
    if (pos.line !== this.activeLine) {
        var rows = this.lines.children;
        if (rows[this.activeLine - 1]) {
            rows[this.activeLine - 1].classList.remove("active");
        }
        if (rows[pos.line - 1]) {
            rows[pos.line - 1].classList.add("active");
        }
        this.activeLine = pos.line;
    }
    this.current.classList.toggle("hidden", sel.start !== sel.end);
    this.updateBracketMatch(sel);
    this.updateHint();
    if (this.options.onCursor) {
        this.options.onCursor(pos, sel.end - sel.start);
    }
};

CodeEditor.prototype.updateBracketMatch = function (sel) {
    var next = {};
    if (sel.start === sel.end) {
        var match = findBracketMatch(this.input.value, sel.start, this.api);
        if (match) {
            next[match[0]] = "match";
            next[match[1]] = "match";
        }
    }
    if (JSON.stringify(next) !== JSON.stringify(this.bracketMarks)) {
        this.bracketMarks = next;
        this.render();
    }
};

function findBracketMatch(text, caret, api) {
    var tokens = tokenize(text, api).filter(function (t) {
        return t.type === "bracket";
    });
    var target = -1;
    for (var i = 0; i < tokens.length; i++) {
        if (tokens[i].start === caret - 1 || tokens[i].start === caret) {
            target = i;
            if (tokens[i].start === caret - 1) {
                break;
            }
        }
    }
    if (target === -1) {
        return null;
    }
    var opens = "([{";
    var closes = ")]}";
    var token = tokens[target];
    var isOpen = opens.indexOf(token.text) !== -1;
    var depth = 0;
    var step = isOpen ? 1 : -1;
    for (var j = target; j >= 0 && j < tokens.length; j += step) {
        var t = tokens[j].text;
        if ((isOpen ? opens : closes).indexOf(t) !== -1) {
            depth++;
        } else {
            depth--;
        }
        if (depth === 0) {
            var pairOk = isOpen ? closes.indexOf(t) === opens.indexOf(token.text) : opens.indexOf(t) === closes.indexOf(token.text);
            return pairOk ? [token.start, tokens[j].start] : null;
        }
    }
    return null;
}

CodeEditor.prototype.setProblems = function (problems) {
    var text = this.input.value;
    var marks = {};
    var self = this;
    this.problems = problems || [];
    this.problems.forEach(function (p) {
        if (p.severity === "warning" && isFinite(p.offset)) {
            marks[p.offset] = "warn";
            return;
        }
        var offset = self.offsetOfLine(p.line) + Math.max(0, (p.column || 1) - 1);
        while (offset < text.length && /[ \t]/.test(text.charAt(offset))) {
            offset++;
        }
        var start = tokenStartAt(text, offset, self.api);
        if (start !== -1) {
            marks[start] = "err";
        }
    });
    this.marks = marks;
    this.gutterDirty = true;
    this.render();
};

function tokenStartAt(text, offset, api) {
    var tokens = tokenize(text, api);
    for (var i = 0; i < tokens.length; i++) {
        var t = tokens[i];
        if (t.type !== "space" && offset >= t.start && offset < t.start + t.text.length) {
            return t.start;
        }
    }
    return -1;
}

CodeEditor.prototype.problemAt = function (line) {
    for (var i = 0; i < this.problems.length; i++) {
        if (this.problems[i].line === line) {
            return this.problems[i];
        }
    }
    return null;
};

CodeEditor.prototype.caretPixel = function (offset) {
    var pos = this.lineColumn(offset);
    var lineText = this.input.value.substring(offset - pos.column + 1, offset).replace(/\t/g, editorIndent);
    return {
        top: pos.line * this.lineHeight - this.scroller.scrollTop + 4,
        left: this.gutter.offsetWidth + lineText.length * this.measure() - this.scroller.scrollLeft + 8
    };
};

CodeEditor.prototype.scrollToCaret = function (center) {
    var pos = this.lineColumn(this.input.selectionEnd);
    var top = (pos.line - 1) * this.lineHeight;
    var view = this.scroller.clientHeight;
    if (center) {
        this.scroller.scrollTop = Math.max(0, top - view / 2);
    } else if (top < this.scroller.scrollTop) {
        this.scroller.scrollTop = Math.max(0, top - this.lineHeight * 2);
    } else if (top + this.lineHeight * 2 > this.scroller.scrollTop + view) {
        this.scroller.scrollTop = top - view + this.lineHeight * 3;
    }
    var left = (pos.column - 1) * this.measure();
    if (left < this.scroller.scrollLeft) {
        this.scroller.scrollLeft = Math.max(0, left - 40);
    } else if (left + 40 > this.scroller.scrollLeft + this.scroller.clientWidth) {
        this.scroller.scrollLeft = left - this.scroller.clientWidth + 80;
    }
};

CodeEditor.prototype.goToLine = function (line) {
    var target = Math.max(1, Math.min(line, this.input.value.split("\n").length));
    var offset = this.offsetOfLine(target);
    this.input.focus();
    this.input.setSelectionRange(offset, offset);
    this.scrollToCaret(true);
    this.updateCursor();
};

CodeEditor.prototype.selectLine = function (line) {
    var start = this.offsetOfLine(line);
    var end = this.input.value.indexOf("\n", start);
    this.input.focus();
    this.input.setSelectionRange(start, end === -1 ? this.input.value.length : end + 1);
    this.updateCursor();
};

CodeEditor.prototype.lineBlock = function () {
    var text = this.input.value;
    var sel = this.selection();
    var start = text.lastIndexOf("\n", sel.start - 1) + 1;
    var endPos = sel.end > sel.start && text.charAt(sel.end - 1) === "\n" ? sel.end - 1 : sel.end;
    var end = text.indexOf("\n", endPos);
    if (end === -1) {
        end = text.length;
    }
    return { start: start, end: end, text: text.substring(start, end), sel: sel };
};

CodeEditor.prototype.rewriteLines = function (transform) {
    var block = this.lineBlock();
    var lines = block.text.split("\n");
    var result = transform(lines);
    var joined = result.lines.join("\n");
    if (joined === block.text) {
        return;
    }
    var firstShift = result.firstShift || 0;
    var selStart = Math.max(block.start, block.sel.start + firstShift);
    var selEnd = block.sel.start === block.sel.end ? selStart : block.sel.end + (joined.length - block.text.length);
    this.replaceRange(block.start, block.end, joined, selStart, Math.max(selStart, selEnd));
};

CodeEditor.prototype.indentLines = function (outdent) {
    this.rewriteLines(function (lines) {
        var firstShift = 0;
        var out = lines.map(function (line, index) {
            var next;
            if (outdent) {
                var remove = /^( {1,4}|\t)/.exec(line);
                next = remove ? line.substring(remove[0].length) : line;
            } else {
                next = line.length ? editorIndent + line : line;
            }
            if (index === 0) {
                firstShift = next.length - line.length;
            }
            return next;
        });
        return { lines: out, firstShift: firstShift };
    });
};

CodeEditor.prototype.toggleComment = function () {
    this.rewriteLines(function (lines) {
        var filled = lines.filter(function (line) {
            return line.trim().length > 0;
        });
        if (!filled.length) {
            return { lines: lines };
        }
        var commented = filled.every(function (line) {
            return line.trim().substr(0, 2) === "//";
        });
        var indent = Math.min.apply(null, filled.map(function (line) {
            return /^\s*/.exec(line)[0].length;
        }));
        var firstShift = 0;
        var out = lines.map(function (line, index) {
            var next = line;
            if (commented) {
                next = line.replace(/^(\s*)\/\/ ?/, "$1");
            } else if (line.trim().length) {
                next = line.substring(0, indent) + "// " + line.substring(indent);
            }
            if (index === 0) {
                firstShift = next.length - line.length;
            }
            return next;
        });
        return { lines: out, firstShift: firstShift };
    });
};

CodeEditor.prototype.moveLines = function (direction, copy) {
    var text = this.input.value;
    var block = this.lineBlock();
    var sel = block.sel;
    if (copy) {
        var insertAt = direction < 0 ? block.start : block.end;
        var added = direction < 0 ? block.text + "\n" : "\n" + block.text;
        var shift = direction < 0 ? 0 : block.text.length + 1;
        this.replaceRange(insertAt, insertAt, added, sel.start + shift, sel.end + shift);
        return;
    }
    if (direction < 0) {
        if (block.start === 0) {
            return;
        }
        var prevStart = text.lastIndexOf("\n", block.start - 2) + 1;
        var prev = text.substring(prevStart, block.start - 1);
        var moved = prev.length + 1;
        this.replaceRange(prevStart, block.end, block.text + "\n" + prev, sel.start - moved, sel.end - moved);
    } else {
        if (block.end >= text.length) {
            return;
        }
        var nextEnd = text.indexOf("\n", block.end + 1);
        if (nextEnd === -1) {
