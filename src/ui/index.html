<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTForge</title>
    <link href="style.css" rel="stylesheet">
    <script src="catalog.js"></script>
    <script src="snippets.js"></script>
    <script src="highlight.js"></script>
    <script src="lint.js"></script>
    <script src="netcalc.js"></script>
    <script src="editor.js"></script>
    <script src="acorn.js"></script>
    <script src="instrument.js"></script>
    <script src="terminal.js"></script>
    <script src="debugview.js"></script>
    <script src="views.js"></script>
    <script src="interface.js"></script>
</head>

<body>
    <div class="app">
        <header class="titlebar">
            <div class="brand" id="brand-logo">
                <svg class="logo" viewBox="303.6 208.3 651.1 651.1" aria-hidden="true">
                    <path fill-rule="evenodd" fill="#E6EDF3" d="M411.2 710.1L410.9 369.6L411.9 359.1L532.8 290.7L628.0 237.9L643.4 246.3L693.0 271.6L796.8 323.6L808.5 330.1L820.3 338.6L830.0 348.4L836.3 357.3L842.5 370.1L845.7 381.4L847.3 394.6L847.3 409.9L845.8 430.7L843.9 443.0L841.4 451.6L837.1 461.5L831.1 471.2L825.7 477.8L817.2 485.3L810.7 490.1L802.7 494.5L784.9 501.5L741.8 515.4L736.2 517.1L716.0 507.4L707.4 504.7L695.9 502.2L692.0 500.9L679.4 493.7L659.9 480.4L661.7 478.8L665.2 477.1L708.2 459.3L723.0 454.4L740.2 449.8L747.0 447.4L755.1 443.2L763.0 437.2L768.7 431.1L773.3 424.2L777.0 416.2L779.3 408.2L780.2 399.8L779.8 390.6L778.2 383.4L775.1 375.0L772.1 369.6L768.1 363.8L763.4 358.5L759.1 354.7L752.9 350.7L745.6 347.0L739.3 344.6L732.4 343.0L725.4 342.0L717.3 341.6L619.6 341.8L593.6 341.7L476.6 406.3L475.9 418.1L475.7 739.0L475.0 741.9L474.4 742.7L473.3 743.1L470.1 742.0L456.9 735.5L415.5 712.5L413.5 711.7ZM566.1 554.9L570.7 553.5L631.7 529.1L635.5 528.0L637.6 528.6L638.7 530.8L639.1 535.0L639.8 619.2L641.5 622.5L653.8 619.4L796.9 577.0L800.1 576.3L802.1 576.4L803.5 577.3L804.3 579.0L804.8 586.4L804.7 627.5L803.9 632.0L801.9 634.5L792.3 637.9L662.7 677.3L645.3 682.9L640.5 686.8L640.1 694.9L640.6 821.7L640.0 828.0L639.2 829.4L638.0 829.8L633.1 827.8L571.1 793.8L567.7 791.4L566.2 788.5L565.6 784.5Z" />
                    <path fill-rule="evenodd" fill="#3B8EEA" d="M728.9 569.7L725.5 573.6L719.9 577.9L715.9 579.9L708.9 581.9L699.1 582.3L693.1 581.0L684.1 576.7L679.3 572.6L676.1 568.6L673.4 562.9L671.2 553.6L671.9 541.2L549.2 463.1L547.6 463.1L538.9 467.9L529.4 469.4L519.1 468.3L510.1 464.0L505.1 459.7L501.3 454.9L499.2 450.6L497.1 443.7L497.2 432.4L499.0 425.1L501.5 420.4L506.6 414.4L512.4 410.2L519.1 407.2L526.4 406.0L533.9 406.5L541.9 409.1L546.9 412.1L556.4 421.4L575.9 418.0L695.6 392.6L696.8 391.6L700.4 382.2L705.0 376.1L710.2 371.1L720.1 367.2L726.1 366.2L733.6 366.4L739.9 368.2L747.7 372.1L753.7 378.1L758.9 387.3L760.5 395.4L760.3 403.9L759.0 409.9L754.8 417.9L747.9 424.9L740.9 429.0L733.6 430.9L727.1 431.3L722.1 430.6L714.1 427.9L706.6 422.6L701.1 415.9L697.9 410.1L696.6 409.6L561.4 437.9L560.3 439.1L558.8 447.9L560.1 449.8L680.4 526.6L681.6 526.7L691.1 521.0L700.4 518.9L705.9 519.0L711.9 520.1L720.9 524.1L726.6 529.1L729.9 533.2L732.9 539.1L734.5 545.1L734.8 552.6L733.8 559.6Z" />
                </svg>
            </div>
            <nav class="menubar" id="menubar"></nav>
            <div class="command-center" data-cmd="go.file">
                <svg class="ico" viewBox="0 0 16 16"><path d="M15.25 13.8l-4.13-4.14a5.5 5.5 0 1 0-1.41 1.41l4.13 4.14 1.41-1.41zM2 6.5a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0z" /></svg>
                <span>PTForge</span>
            </div>
            <div class="title-grow"></div>
        </header>

        <div class="workbench">
            <nav class="activitybar" id="activitybar"></nav>
            <aside class="sidebar" id="sidebar"></aside>
            <div class="sash sash-x" id="sash-side"></div>

            <main class="main">
                <section class="editor-group">
                    <div class="tabs-row">
                        <div class="tabs" id="tabs"></div>
                        <div class="editor-actions">
                            <span class="ea" data-cmd="run.script" title="Run Without Debugging (Ctrl+F5)"><svg class="ico run-ico" viewBox="0 0 16 16"><path d="M4.74 2.1L14 8l-9.26 5.9A.5.5 0 0 1 4 13.5v-11a.5.5 0 0 1 .74-.4z" /></svg></span>
                            <span class="ea" data-cmd="debug.start" title="Start Debugging (F5)"><svg class="ico" viewBox="0 0 16 16"><path d="M4.74 2.1L14 8l-9.26 5.9A.5.5 0 0 1 4 13.5v-11a.5.5 0 0 1 .74-.4z" fill="none" stroke="currentColor" /><circle cx="12" cy="12" r="3" fill="#F85149" /></svg></span>
                            <span class="ea" data-cmd="view.palette" title="More Actions"><svg class="ico" viewBox="0 0 16 16"><path d="M4 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm5 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm5 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" /></svg></span>
                        </div>
                    </div>
                    <div class="editor-title" id="editor-title">
                        <div class="breadcrumbs" id="breadcrumbs"></div>
                    </div>
                    <div class="editors" id="editors">
                        <div class="find hidden" id="find">
                            <span class="find-toggle" id="find-toggle" title="Toggle Replace"><svg class="ico" viewBox="0 0 16 16"><path d="M10.07 8L5.6 3.53l.7-.7 4.82 4.82v.7L6.3 13.17l-.7-.7L10.07 8z" /></svg></span>
                            <div class="find-rows">
                                <div class="find-row">
                                    <div class="find-field">
                                        <input id="find-input" placeholder="Find" spellcheck="false">
                                        <span class="opt" id="find-case" title="Match Case">Aa</span>
                                        <span class="opt" id="find-word" title="Match Whole Word"><u>ab</u></span>
                                        <span class="opt" id="find-regex" title="Use Regular Expression">.*</span>
                                    </div>
                                    <span class="find-count" id="find-count">No results</span>
                                    <span class="fbtn" id="find-prev" title="Previous Match (Shift+Enter)"><svg class="ico" viewBox="0 0 16 16"><path d="M3.15 10.35l.7.7L8 6.92l4.15 4.13.7-.7L8.35 5.87h-.7l-4.5 4.48z" /></svg></span>
                                    <span class="fbtn" id="find-next" title="Next Match (Enter)"><svg class="ico" viewBox="0 0 16 16"><path d="M12.85 5.65l-.7-.7L8 9.08 3.85 4.95l-.7.7 4.5 4.48h.7l4.5-4.48z" /></svg></span>
                                    <span class="fbtn" id="find-close" title="Close (Escape)"><svg class="ico" viewBox="0 0 16 16"><path d="M8 8.7l3.65 3.65.7-.7L8.7 8l3.65-3.65-.7-.7L8 7.3 4.35 3.65l-.7.7L7.3 8l-3.65 3.65.7.7L8 8.7z" /></svg></span>
                                </div>
                                <div class="find-row replace-row">
                                    <div class="find-field"><input id="replace-input" placeholder="Replace" spellcheck="false"></div>
                                    <span class="fbtn" id="replace-one" title="Replace (Enter)"><svg class="ico" viewBox="0 0 16 16"><path d="M3.2 9.5H1v-1h2.2l.5.5v2.3l1.2-1.2.7.7-2.4 2.4H2.5L.1 10.8l.7-.7 1.2 1.2V9.5h1.2zM6 4h8v1H6V4zm0 3h8v1H6V7zm0 3h8v1H6v-1zm0 3h8v1H6v-1z" /></svg></span>
                                    <span class="fbtn" id="replace-all" title="Replace All"><svg class="ico" viewBox="0 0 16 16"><path d="M11.6 2.7l.7-.7 1.3 1.3V1h1v2.3l1.3-1.3.7.7-2.5 2.5h-.4L11.6 2.7zM1 5h9v1H1V5zm0 3h13v1H1V8zm0 3h13v1H1v-1zm0 3h9v1H1v-1z" /></svg></span>
                                </div>
                            </div>
                        </div>
                        <div class="welcome hidden" id="welcome"></div>
                    </div>
                    <div class="debug-toolbar hidden" id="debug-toolbar">
                        <span class="dt-grip" title="Drag"></span>
                        <span class="dt-btn dt-continue" data-cmd="debug.continue" data-needs-pause title="Continue (F5)"><svg class="ico" viewBox="0 0 16 16"><path d="M2.5 2H4v12H2.5V2zm4.04.13L13.7 7.4v1.2l-7.16 5.27L5.5 13.4V2.6l1.04-.47zM7 12.3L12.1 8 7 3.7v8.6z" /></svg></span>
                        <span class="dt-btn dt-step" data-cmd="debug.stepOver" data-needs-pause title="Step Over (F10)"><svg class="ico" viewBox="0 0 16 16"><path d="M14.25 5.75v-4h-1.5v2.542c-1.145-1.359-2.911-2.209-4.84-2.209-3.177 0-5.92 2.307-6.16 5.398l-.02.269h1.501l.022-.226c.212-2.195 2.202-3.94 4.656-3.94 1.736 0 3.244.875 4.05 2.166h-2.83v1.5h4.163l.962-.975V5.75h-.004zM8 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" /></svg></span>
                        <span class="dt-btn dt-step" data-cmd="debug.stepInto" data-needs-pause title="Step Into (F11)"><svg class="ico" viewBox="0 0 16 16"><path d="M8 9.532h.542l3.905-3.905-1.061-1.06-2.637 2.61V1H7.251v6.177l-2.637-2.61-1.061 1.06 3.905 3.905H8zm1.956 3.481a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" /></svg></span>
                        <span class="dt-btn dt-step" data-cmd="debug.stepOut" data-needs-pause title="Step Out (Shift+F11)"><svg class="ico" viewBox="0 0 16 16"><path d="M8 1h-.542L3.553 4.905l1.061 1.06 2.637-2.61v6.177h1.498V3.355l2.637 2.61 1.061-1.06L8.542 1H8zm1.956 12.013a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" /></svg></span>
                        <span class="dt-btn dt-step" data-cmd="debug.stepBack" data-needs-pause title="Step Back (Shift+F10)"><svg class="ico" viewBox="0 0 16 16"><path d="M1.75 5.75v-4h1.5v2.542c1.145-1.359 2.911-2.209 4.84-2.209 3.177 0 5.92 2.307 6.16 5.398l.02.269h-1.501l-.022-.226c-.212-2.195-2.202-3.94-4.656-3.94-1.736 0-3.244.875-4.05 2.166h2.83v1.5H2.707l-.962-.975V5.75h.005zM8 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" /></svg></span>
                        <span class="dt-btn dt-restart" data-cmd="debug.restart" title="Restart (Ctrl+Shift+F5)"><svg class="ico" viewBox="0 0 16 16"><path d="M12.75 8a4.5 4.5 0 0 1-8.61 1.834l-1.391.565A6.001 6.001 0 0 0 14.25 8 6 6 0 0 0 3.5 4.334V2.5H2v4l.75.75h3.5v-1.5H4.352A4.5 4.5 0 0 1 12.75 8z" /></svg></span>
                        <span class="dt-btn dt-stop" data-cmd="debug.stop" title="Stop (Shift+F5)"><svg class="ico" viewBox="0 0 16 16"><path d="M2 2v12h12V2H2zm10.75 10.75h-9.5v-9.5h9.5v9.5z" /></svg></span>
                    </div>
                </section>

                <div class="sash sash-y" id="sash-panel"></div>

                <section class="panel" id="panel">
                    <div class="panel-head">
                        <span class="panel-tab" data-panel="problems">Problems <span class="badge hidden" id="problems-badge">0</span></span>
                        <span class="panel-tab" data-panel="output">Output</span>
                        <span class="panel-tab" data-panel="debug">Debug Console</span>
                        <span class="panel-tab" data-panel="terminal">Terminal</span>
                        <span class="panel-tab" data-panel="checks">Lab Check</span>
                        <span class="panel-grow"></span>
                        <span class="panel-actions" id="panel-actions"></span>
                    </div>
                    <div class="panel-body" id="panel-problems"></div>
                    <div class="panel-body hidden" id="panel-output"></div>
                    <div class="panel-body panel-debug hidden" id="panel-debug">
                        <div class="dc-out" id="debug-console-out"></div>
                        <div class="dc-input-row"><span class="dc-prompt">&#x203A;</span><input id="debug-console-input" spellcheck="false" autocomplete="off" placeholder="Evaluate an expression. While paused, recorded variables are shown."></div>
                    </div>
                    <div class="panel-body panel-terminal hidden" id="panel-terminal">
                        <div class="term-views" id="term-views"></div>
                        <div class="term-tabs hidden" id="term-tabs"></div>
                        <div class="empty hidden" id="term-empty">No terminal is open. <a data-cmd="terminal.new">Create a new terminal</a></div>
                    </div>
                    <div class="panel-body hidden" id="panel-checks"></div>
                </section>
            </main>
        </div>

        <footer class="statusbar" id="statusbar">
            <span class="sb-item sb-remote" id="sb-mode"></span>
            <span class="sb-item sb-click sb-debug hidden" id="sb-debug" data-cmd="view.debug"></span>
            <span class="sb-item sb-click" id="sb-errors" data-cmd="view.problems"></span>
            <span class="sb-item" id="sb-run"></span>
            <span class="sb-item sb-message" id="sb-message"></span>
            <span class="sb-grow"></span>
            <span class="sb-item sb-click" id="sb-position" data-cmd="go.line">Ln 1, Col 1</span>
            <span class="sb-item">Spaces: 4</span>
            <span class="sb-item">UTF-8</span>
            <span class="sb-item">LF</span>
            <span class="sb-item sb-click" data-cmd="view.functions">{ } JavaScript</span>
            <span class="sb-item sb-click" id="sb-zoom" data-cmd="view.zoomReset" title="Reset Zoom">14px</span>
            <span class="sb-item sb-click" data-cmd="help.keys" title="Keyboard Shortcuts"><svg class="ico" viewBox="0 0 16 16"><path d="M13.38 12H2.62l.84-1.28A4.3 4.3 0 0 0 4 8.73V6.5a4 4 0 0 1 8 0v2.23c0 .7.2 1.39.54 1.99l.84 1.28zM6.5 13.5h3a1.5 1.5 0 0 1-3 0z" fill="none" stroke="currentColor" /></svg></span>
        </footer>

        <div class="palette hidden" id="palette">
            <div class="palette-box">
                <input id="palette-input" spellcheck="false" autocomplete="off">
                <div class="palette-list" id="palette-list"></div>
            </div>
        </div>
        <div class="dialog hidden" id="dialog">
            <div class="dialog-box" id="dialog-box"></div>
        </div>
        <div class="toasts" id="toasts"></div>
        <div class="debug-hover hidden" id="debug-hover"></div>
    </div>
    <script>
        initEditor();
    </script>
</body>

</html>
