<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="style.css" rel="stylesheet">
    <script src="catalog.js"></script>

    <script src="terminal.js"></script>
    <script src="debugview.js"></script>
    <script src="views.js"></script>
    <script src="interface.js"></script>
</head>

<body>

                </svg>
            </div>
            <nav class="menubar" id="menubar"></nav>
            <div class="command-center" data-cmd="go.file">
                <svg class="ico" viewBox="0 0 24 24"><path d="M15.25 0a8.25 8.25 0 0 0-6.18 13.72L1 22.88l1.12 1 8.05-9.12A8.251 8.251 0 1 0 15.25.01V0zm0 15a6.75 6.75 0 1 1 0-13.5 6.75 6.75 0 0 1 0 13.5z"/></svg>
                <span>PTForge</span>
            </div>
            <div class="title-grow"></div>
        </header>

        <div class="workbench">
            <nav class="activitybar" id="activitybar"></nav>
            <aside class="sidebar" id="sidebar"></aside>
            <div class="sash sash-x" id="sash-side"></div>

            <main class="main">
                <section class="editor-group">
                    <div class="tabs-row">
                        <div class="tabs" id="tabs"></div>
                        <div class="editor-actions">
                            <span class="ea" data-cmd="run.script" title="Run Without Debugging (Ctrl+F5)"><svg class="ico run-ico" viewBox="0 0 24 24"><path d="M3.78 2L3 2.41v12l.78.42 9-6V8l-9-6zM4 13.48V3.35l7.6 5.07L4 13.48z"/></svg></span>
                            <span class="ea" data-cmd="debug.start" title="Start Debugging (F5)"><svg class="ico" viewBox="0 0 24 24"><path d="M10.94 13.5l-1.32 1.32a3.73 3.73 0 0 0-7.24 0L1.06 13.5 0 14.56l1.72 1.72-.22.22V18H0v1.5h1.5v.08c.077.489.214.966.41 1.42L0 22.94 1.06 24l1.65-1.65A4.308 4.308 0 0 0 6 24a4.31 4.31 0 0 0 3.29-1.65L10.94 24 12 22.94 10.09 21c.198-.464.336-.951.41-1.45v-.1H12V18h-1.5v-1.5l-.22-.22L12 14.56l-1.06-1.06zM6 13.5a2.25 2.25 0 0 1 2.25 2.25h-4.5A2.25 2.25 0 0 1 6 13.5zm3 6a3.33 3.33 0 0 1-3 3 3.33 3.33 0 0 1-3-3v-2.25h6v2.25zm14.76-9.9v1.26L13.5 17.37V15.6l8.5-5.37L9 2v9.46a5.07 5.07 0 0 0-1.5-.72V.63L8.64 0l15.12 9.6z"/></svg></span>
                            <span class="ea" data-cmd="view.palette" title="More Actions"><svg class="ico" viewBox="0 0 24 24"><path d="M4 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm5 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm5 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/></svg></span>
                        </div>
                    </div>
                    <div class="editor-title" id="editor-title">
                        <div class="breadcrumbs" id="breadcrumbs"></div>
                    </div>
                    <div class="editors" id="editors">
                        <div class="find hidden" id="find">
                            <span class="find-toggle" id="find-toggle" title="Toggle Replace"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.072 8.024L5.715 3.667l.618-.62L11 7.716v.618L6.333 13l-.618-.619 4.357-4.357z"/></svg></span>
                            <div class="find-rows">
                                <div class="find-row">
                                    <div class="find-field">
                                        <input id="find-input" placeholder="Find" spellcheck="false">
                                        <span class="opt" id="find-case" title="Match Case">Aa</span>
                                        <span class="opt" id="find-word" title="Match Whole Word"><u>ab</u></span>
                                        <span class="opt" id="find-regex" title="Use Regular Expression">.*</span>
                                    </div>
                                    <span class="find-count" id="find-count">No results</span>
                                    <span class="fbtn" id="find-prev" title="Previous Match (Shift+Enter)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M13.854 7l-5-5h-.707l-5 5 .707.707L8 3.561V14h1V3.56l4.146 4.147.708-.707z"/></svg></span>
                                    <span class="fbtn" id="find-next" title="Next Match (Enter)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.147 9l5 5h.707l5-5-.707-.707L9 12.439V2H8v10.44L3.854 8.292 3.147 9z"/></svg></span>
                                    <span class="fbtn" id="find-close" title="Close (Escape)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 8.707l3.646 3.647.708-.707L8.707 8l3.647-3.646-.707-.708L8 7.293 4.354 3.646l-.707.708L7.293 8l-3.646 3.646.707.708L8 8.707z"/></svg></span>
                                </div>
                                <div class="find-row replace-row">
                                    <div class="find-field"><input id="replace-input" placeholder="Replace" spellcheck="false"></div>
                                    <span class="fbtn" id="replace-one" title="Replace (Enter)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.221 3.739l2.261 2.269L7.7 3.784l-.7-.7-1.012 1.007-.008-1.6a.523.523 0 0 1 .5-.526H8V1H6.48A1.482 1.482 0 0 0 5 2.489V4.1L3.927 3.033l-.706.706zm6.67 1.794h.01c.183.311.451.467.806.467.393 0 .706-.168.94-.503.236-.335.353-.78.353-1.333 0-.511-.1-.913-.301-1.207-.201-.295-.488-.442-.86-.442-.405 0-.718.194-.938.581h-.01V1H9v4.919h.89v-.386zm-.015-1.061v-.34c0-.248.058-.448.175-.601a.54.54 0 0 1 .445-.23.49.49 0 0 1 .436.233c.104.154.155.368.155.643 0 .33-.056.587-.169.768a.524.524 0 0 1-.47.27.495.495 0 0 1-.411-.211.853.853 0 0 1-.16-.532zM9 12.769c-.256.154-.625.231-1.108.231-.563 0-1.02-.178-1.369-.533-.349-.355-.523-.813-.523-1.374 0-.648.186-1.158.56-1.53.374-.376.875-.563 1.5-.563.433 0 .746.06.94.179v.998a1.26 1.26 0 0 0-.792-.276c-.325 0-.583.1-.774.298-.19.196-.283.468-.283.816 0 .338.09.603.272.797.182.191.431.287.749.287.282 0 .558-.092.828-.276v.946zM4 7L3 8v6l1 1h7l1-1V8l-1-1H4zm0 1h7v6H4V8z"/></svg></span>
                                    <span class="fbtn" id="replace-all" title="Replace All"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M11.6 2.677c.147-.31.356-.465.626-.465.248 0 .44.118.573.353.134.236.201.557.201.966 0 .443-.078.798-.235 1.067-.156.268-.365.402-.627.402-.237 0-.416-.125-.537-.374h-.008v.31H11V1h.593v1.677h.008zm-.016 1.1a.78.78 0 0 0 .107.426c.071.113.163.169.274.169.136 0 .24-.072.314-.216.075-.145.113-.35.113-.615 0-.22-.035-.39-.104-.514-.067-.124-.164-.187-.29-.187-.12 0-.219.062-.297.185a.886.886 0 0 0-.117.48v.272zM4.12 7.695L2 5.568l.662-.662 1.006 1v-1.51A1.39 1.39 0 0 1 5.055 3H7.4v.905H5.055a.49.49 0 0 0-.468.493l.007 1.5.949-.944.656.656-2.08 2.085zM9.356 4.93H10V3.22C10 2.408 9.685 2 9.056 2c-.135 0-.285.024-.45.073a1.444 1.444 0 0 0-.388.167v.665c.237-.203.487-.304.75-.304.261 0 .392.156.392.469l-.6.103c-.506.086-.76.406-.76.961 0 .263.061.473.183.631A.61.61 0 0 0 8.69 5c.29 0 .509-.16.657-.48h.009v.41zm.004-1.355v.193a.75.75 0 0 1-.12.436.368.368 0 0 1-.313.17.276.276 0 0 1-.22-.095.38.38 0 0 1-.08-.248c0-.222.11-.351.332-.389l.4-.067zM7 12.93h-.644v-.41h-.009c-.148.32-.367.48-.657.48a.61.61 0 0 1-.507-.235c-.122-.158-.183-.368-.183-.63 0-.556.254-.876.76-.962l.6-.103c0-.313-.13-.47-.392-.47-.263 0-.513.102-.75.305v-.665c.095-.063.224-.119.388-.167.165-.049.315-.073.45-.073.63 0 .944.407.944 1.22v1.71zm-.64-1.162v-.193l-.4.068c-.222.037-.333.166-.333.388 0 .1.027.183.08.248a.276.276 0 0 0 .22.095.368.368 0 0 0 .312-.17c.08-.116.12-.26.12-.436zM9.262 13c.321 0 .568-.058.738-.173v-.71a.9.9 0 0 1-.552.207.619.619 0 0 1-.5-.215c-.12-.145-.181-.345-.181-.598 0-.26.063-.464.189-.612a.644.644 0 0 1 .516-.223c.194 0 .37.069.528.207v-.749c-.129-.09-.338-.134-.626-.134-.417 0-.751.14-1.001.422-.249.28-.373.662-.373 1.148 0 .42.116.764.349 1.03.232.267.537.4.913.4zM2 9l1-1h9l1 1v5l-1 1H3l-1-1V9zm1 0v5h9V9H3zm3-2l1-1h7l1 1v5l-1 1V7H6z"/></svg></span>
                                </div>
                            </div>
                        </div>
                        <div class="welcome hidden" id="welcome"></div>
                    </div>
                    <div class="debug-toolbar hidden" id="debug-toolbar">
                        <span class="dt-grip" title="Drag"></span>
                        <span class="dt-btn dt-continue" data-cmd="debug.continue" data-needs-pause title="Continue (F5)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.5 2H4v12H2.5V2zm4.936.39L6.25 3v10l1.186.61 7-5V7.39l-7-5zM12.71 8l-4.96 3.543V4.457L12.71 8z"/></svg></span>
                        <span class="dt-btn dt-step" data-cmd="debug.stepOver" data-needs-pause title="Step Over (F10)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M14.25 5.75v-4h-1.5v2.542c-1.145-1.359-2.911-2.209-4.84-2.209-3.177 0-5.92 2.307-6.16 5.398l-.02.269h1.501l.022-.226c.212-2.195 2.202-3.94 4.656-3.94 1.736 0 3.244.875 4.05 2.166h-2.83v1.5h4.163l.962-.975V5.75h-.004zM8 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg></span>
                        <span class="dt-btn dt-step" data-cmd="debug.stepInto" data-needs-pause title="Step Into (F11)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 9.532h.542l3.905-3.905-1.061-1.06-2.637 2.61V1H7.251v6.177l-2.637-2.61-1.061 1.06 3.905 3.905H8zm1.956 3.481a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/></svg></span>
                        <span class="dt-btn dt-step" data-cmd="debug.stepOut" data-needs-pause title="Step Out (Shift+F11)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 1h-.542L3.553 4.905l1.061 1.06 2.637-2.61v6.177h1.498V3.355l2.637 2.61 1.061-1.06L8.542 1H8zm1.956 12.013a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/></svg></span>
                        <span class="dt-btn dt-step" data-cmd="debug.stepBack" data-needs-pause title="Step Back (Shift+F10)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M1.75 5.75v-4h1.5v2.542c1.145-1.359 2.911-2.209 4.84-2.209 3.177 0 5.92 2.307 6.16 5.398l.02.269h-1.5l-.022-.226c-.212-2.195-2.202-3.94-4.656-3.94-1.736 0-3.244.875-4.05 2.166h2.83v1.5H2.707l-.961-.975V5.75h.003zM8 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg></span>
                        <span class="dt-btn dt-restart" data-cmd="debug.restart" title="Restart (Ctrl+Shift+F5)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.75 8a4.5 4.5 0 0 1-8.61 1.834l-1.391.565A6.001 6.001 0 0 0 14.25 8 6 6 0 0 0 3.5 4.334V2.5H2v4l.75.75h3.5v-1.5H4.352A4.5 4.5 0 0 1 12.75 8z"/></svg></span>
                        <span class="dt-btn dt-stop" data-cmd="debug.stop" title="Stop (Shift+F5)"><svg class="ico" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M13 1.99976L14 2.99976V12.9998L13 13.9998H3L2 12.9998L2 2.99976L3 1.99976H13ZM12.7461 3.25057L3.25469 3.25057L3.25469 12.7504H12.7461V3.25057Z"/></svg></span>
                    </div>
                </section>

                <div class="sash sash-y" id="sash-panel"></div>

                <section class="panel" id="panel">
                    <div class="panel-head">
                        <span class="panel-tab" data-panel="problems">Problems <span class="badge hidden" id="problems-badge">0</span></span>
                        <span class="panel-tab" data-panel="output">Output</span>
                        <span class="panel-tab" data-panel="debug">Debug Console</span>
                        <span class="panel-tab" data-panel="terminal">Terminal</span>
                        <span class="panel-tab" data-panel="checks">Lab Check</span>
                        <span class="panel-grow"></span>
                        <span class="panel-actions" id="panel-actions"></span>
                    </div>
                    <div class="panel-body" id="panel-problems"></div>
                    <div class="panel-body hidden" id="panel-output"></div>
                    <div class="panel-body panel-debug hidden" id="panel-debug">
                        <div class="dc-out" id="debug-console-out"></div>
                        <div class="dc-input-row"><span class="dc-prompt">&#x203A;</span><input id="debug-console-input" spellcheck="false" autocomplete="off" placeholder="Evaluate an expression. While paused, recorded variables are shown."></div>
                    </div>
                    <div class="panel-body panel-terminal hidden" id="panel-terminal">
                        <div class="term-views" id="term-views"></div>
                        <div class="term-tabs hidden" id="term-tabs"></div>
                        <div class="empty hidden" id="term-empty">No terminal is open. <a data-cmd="terminal.new">Create a new terminal</a></div>
                    </div>
                    <div class="panel-body hidden" id="panel-checks"></div>
                </section>
            </main>
        </div>

        <footer class="statusbar" id="statusbar">
            <span class="sb-item sb-remote" id="sb-mode"></span>
            <span class="sb-item sb-click sb-debug hidden" id="sb-debug" data-cmd="view.debug"></span>
            <span class="sb-item sb-click" id="sb-errors" data-cmd="view.problems"></span>
            <span class="sb-item" id="sb-run"></span>
            <span class="sb-item sb-message" id="sb-message"></span>
            <span class="sb-grow"></span>
            <span class="sb-item sb-click" id="sb-position" data-cmd="go.line">Ln 1, Col 1</span>
            <span class="sb-item">Spaces: 4</span>
            <span class="sb-item">UTF-8</span>
            <span class="sb-item">LF</span>
            <span class="sb-item sb-click" data-cmd="view.functions">{ } JavaScript</span>
            <span class="sb-item sb-click" id="sb-zoom" data-cmd="view.zoomReset" title="Reset Zoom">14px</span>
            <span class="sb-item sb-click" data-cmd="help.keys" title="Keyboard Shortcuts"><svg class="ico" viewBox="0 0 24 24"><path d="M13.377 10.573a7.63 7.63 0 0 1-.383-2.38V6.195a5.115 5.115 0 0 0-1.268-3.446 5.138 5.138 0 0 0-3.242-1.722c-.694-.072-1.4 0-2.07.227-.67.215-1.28.574-1.794 1.053a4.923 4.923 0 0 0-1.208 1.675 5.067 5.067 0 0 0-.431 2.022v2.2a7.61 7.61 0 0 1-.383 2.37L2 12.343l.479.658h3.505c0 .526.215 1.04.586 1.412.37.37.885.586 1.412.586.526 0 1.04-.215 1.411-.586s.587-.886.587-1.412h3.505l.478-.658-.586-1.77zm-4.69 3.147a.997.997 0 0 1-.705.299.997.997 0 0 1-.706-.3.997.997 0 0 1-.3-.705h1.999a.939.939 0 0 1-.287.706zm-5.515-1.71l.371-1.114a8.633 8.633 0 0 0 .443-2.691V6.004c0-.563.12-1.113.347-1.616.227-.514.55-.969.969-1.34.419-.382.91-.67 1.436-.837.538-.18 1.1-.24 1.65-.18a4.147 4.147 0 0 1 2.597 1.4 4.133 4.133 0 0 1 1.004 2.776v2.01c0 .909.144 1.818.443 2.691l.371 1.113h-9.63v-.012z"/></svg></span>
        </footer>

        <div class="palette hidden" id="palette">
            <div class="palette-box">
                <input id="palette-input" spellcheck="false" autocomplete="off">
                <div class="palette-list" id="palette-list"></div>
            </div>
        </div>
        <div class="dialog hidden" id="dialog">
            <div class="dialog-box" id="dialog-box"></div>
        </div>
        <div class="toasts" id="toasts"></div>
        <div class="debug-hover hidden" id="debug-hover"></div>
    </div>
    <script>
        initEditor();
    </script>
</body>

</html>
