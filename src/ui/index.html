<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTForge</title>
    <link href="style.css" rel="stylesheet">
    <script src="catalog.js"></script>
    <script src="interface.js"></script>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
                    <defs>
                        <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0" stop-color="#ff6a00" />
                            <stop offset="1" stop-color="#ffd166" />
                        </linearGradient>
                    </defs>
                    <path d="M16 2c1.5 4-2 5.5-2 9 0 1.7 1.3 3 3 3s3-1.4 3-3.2c2 1.8 3 4.2 3 6.2H9c0-5 7-7.5 7-15z" fill="url(#flame)" />
                    <path d="M4 19h24v3c0 1.1-.9 2-2 2h-4l2 4H8l2-4H6c-1.1 0-2-.9-2-2v-3z" fill="#c9d1e0" />
                </svg>
                <div>
                    <div class="brand-name">PTForge</div>
                    <div class="brand-sub">Packet Tracer automation</div>
                </div>
            </div>

            <div class="tabs" id="tabs"></div>

            <div class="actions">
                <button class="btn ghost" onclick="changeFontSize(-1)" title="Smaller text">A-</button>
                <button class="btn ghost" onclick="changeFontSize(1)" title="Larger text">A+</button>
                <button class="btn ghost" onclick="pasteFromClipboard()" title="Replace with clipboard">
                    <svg viewBox="0 0 24 24"><path d="M9 3h6v3H9zM6 5h2v2h8V5h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" /></svg>Paste
                </button>
                <button class="btn ghost" onclick="copyToClipboard()" title="Copy script">
                    <svg viewBox="0 0 24 24"><path d="M8 3h11a1 1 0 0 1 1 1v12h-2V5H8zM4 7h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" /></svg>Copy
                </button>
                <button class="btn ghost danger" onclick="clearEditor()" title="Clear script">
                    <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 8h12l-1 13H7z" /></svg>Clear
                </button>
                <button class="btn run" onclick="executeCode()" title="Ctrl+Enter runs the script, Ctrl+Shift+Enter runs the selection">
                    <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" /></svg>Run
                </button>
            </div>
        </header>

        <div class="main">
            <aside class="sidebar">
                <div class="side-tabs">
                    <button class="side-tab active" data-panel="functions" onclick="showPanel('functions')">Functions</button>
                    <button class="side-tab" data-panel="snippets" onclick="showPanel('snippets')">Snippets</button>
                </div>
                <div class="panel" id="panel-functions">
                    <input id="search" class="search" type="text" placeholder="Search functions..." spellcheck="false">
                    <div id="function-list" class="list"></div>
                </div>
                <div class="panel hidden" id="panel-snippets">
                    <div id="snippet-list" class="list"></div>
                </div>
            </aside>

            <section class="workbench">
                <div class="editor-wrap">
                    <pre id="gutter" class="gutter">1</pre>
                    <textarea id="editor" class="editor" spellcheck="false" wrap="off" placeholder="addDevice(&quot;R1&quot;, &quot;2911&quot;, 100, 100);"></textarea>
                </div>

                <div class="output">
                    <div class="output-head">
                        <span>Output</span>
                        <button class="link" onclick="clearOutput()">Clear</button>
                    </div>
                    <div id="output" class="output-body"></div>
                </div>
            </section>
        </div>

        <footer class="statusbar">
            <span id="status">Ready</span>
            <span class="grow"></span>
            <span id="position">Ln 1, Col 1</span>
            <span id="length">0 lines</span>
            <span>Ctrl+Enter run</span>
        </footer>
    </div>
    <script>
        initEditor();
    </script>
</body>

</html>
